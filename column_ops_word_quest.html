    // =====================================================================
    // 1. PURE MATH ENGINE  (spec: specs/SPEC-MODULES.md §M1, tests: tests/acceptance.spec.mjs)
    //    Column index p = power of ten (0 = ones ... 3 = thousands), matching
    //    input ids ans_<p> / carry_<p>.
    // =====================================================================
    const TNQMath = (() => {
      const PLACES = ['ones', 'tens', 'hundreds', 'thousands'];
      const digitsByPower = (n, width) => {
        const out = [];
        for (let p = 0; p < width; p++) out.push(Math.floor(n / 10 ** p) % 10);
        return out;
      };

      function columnAdd(a, b, width = 4) {
        const A = digitsByPower(a, width), B = digitsByPower(b, width);
        const steps = [], marks = Array(width).fill('');
        let carry = 0;
        for (let p = 0; p < width; p++) {
          const sum = A[p] + B[p] + carry;
          const carryOut = sum >= 10 ? 1 : 0;
          steps.push({ p, place: PLACES[p], top: A[p], bottom: B[p], carryIn: carry, sum, digit: sum % 10, carryOut });
          if (carryOut && p + 1 < width) marks[p + 1] = '1';
          carry = carryOut;
        }
        const result = a + b;
        return {
          op: '+', a, b, width, steps, marks, result, overflow: carry === 1,
          resultDigits: digitsByPower(result, width),
          regroupPlaces: steps.filter(s => s.carryOut).map(s => s.place),
          regroupCount: steps.filter(s => s.carryOut).length
        };
      }

      // Standard US/Canadian borrowing: borrow only when top < bottom; borrow from the
      // nearest non-zero column to the left; intermediate zeros become 9.
      function columnSub(a, b, width = 4) {
        if (b > a) throw new RangeError('columnSub expects a >= b');
        const top = digitsByPower(a, width), bot = digitsByPower(b, width);
        const work = top.slice();
        const steps = [];
        let acrossZero = false;
        for (let p = 0; p < width; p++) {
          const before = work[p];
          let lender = null;
          if (work[p] < bot[p]) {
            let q = p + 1;
            while (q < width && work[q] === 0) q++;
            if (q >= width) throw new RangeError('nothing to borrow from');
            work[q] -= 1;
            for (let r = q - 1; r > p; r--) { work[r] = 9; acrossZero = true; }
            work[p] += 10;
            lender = PLACES[q];
          }
          steps.push({ p, place: PLACES[p], topOriginal: top[p], topBefore: before, topWorking: work[p], bottom: bot[p], borrowed: lender !== null, lender, digit: work[p] - bot[p] });
        }
        const marks = work.map((v, p) => (v !== top[p] ? String(v) : ''));
        const result = a - b;
        return {
          op: '-', a, b, width, steps, marks, adjustedTop: work, result, acrossZero,
          resultDigits: digitsByPower(result, width),
          regroupPlaces: steps.filter(s => s.borrowed).map(s => s.place),
          regroupCount: steps.filter(s => s.borrowed).length
        };
      }

      const solve = (a, b, op, width = 4) => (op === '+' ? columnAdd(a, b, width) : columnSub(a, b, width));

      // Regroup row is optional, but anything written must be correct and necessary.
      function validateMarks(sol, entered) {
        const unnecessary = [], wrong = [], missing = [];
        for (let p = 0; p < sol.width; p++) {
          const e = String(entered[p] ?? '').trim();
          const m = sol.marks[p];
          if (e === '' && m !== '') missing.push(PLACES[p]);
          else if (e !== '' && m === '') unnecessary.push(PLACES[p]);
          else if (e !== '' && e !== m) wrong.push(PLACES[p]);
        }
        return { ok: !unnecessary.length && !wrong.length, unnecessary, wrong, missing };
      }

      // Per-digit answer check. Blank is accepted only for leading zeros.
      function validateAnswer(sol, entered) {
        const wrongPlaces = [];
        let leading = true;
        for (let p = sol.width - 1; p >= 0; p--) {
          const exp = sol.resultDigits[p];
          const e = String(entered[p] ?? '').trim();
          if (leading && exp === 0 && (e === '' || e === '0')) continue;
          leading = false;
          if (e !== String(exp)) wrongPlaces.push(PLACES[p]);
        }
        return { ok: wrongPlaces.length === 0, wrongPlaces };

      // Clue-word detective. Longest phrase wins; the question sentence is searched first
      // so narrative words ("earned", "spent") in the set-up cannot override the question.
      const CLUE_RULES = [
        ['how many more', '-'], ['how much more', '-'], ['how much further', '-'], ['how many left', '-'],
        ['how much change', '-'], ['change back', '-'], ['not sold', '-'], ['gave away', '-'], ['take away', '-'],
        ['decreased by', '-'], ['fewer than', '-'], ['difference', '-'], ['remaining', '-'], ['further', '-'],
        ['remain', '-'], ['fewer', '-'], ['spent', '-'], ['lost', '-'], ['left', '-'],
        ['in total', '+'], ['total sum', '+'], ['total amount', '+'], ['altogether', '+'], ['all together', '+'],
        ['increased by', '+'], ['added to', '+'], ['combined', '+'], ['in both', '+'], ['both', '+'],
        ['total', '+'], ['plus', '+'], ['sum', '+'], ['gained', '+']
      ].sort((x, y) => y[0].length - x[0].length);

      function classifyClue(text) {
        const plain = String(text).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
        const sentences = plain.split(/(?<=[.?!])\s+/);
        const question = [...sentences].reverse().find(s => s.includes('?'));
        for (const scope of [question, plain]) {
          if (!scope) continue;
          for (const [phrase, op] of CLUE_RULES) {
            const re = new RegExp('(^|[^a-z])' + phrase.replace(/ /g, '\\s+') + '(?![a-z])');
            if (re.test(scope)) return { op, phrase, scope: scope === question ? 'question' : 'story' };
          }
        }
        return { op: null, phrase: null, scope: null };
      }

      return { PLACES, digitsByPower, columnAdd, columnSub, solve, validateMarks, validateAnswer, classifyClue, CLUE_RULES };
    })();

    // =====================================================================

    // =====================================================================
    // 4. STATE + UTILITIES
    // =====================================================================
    const MODES = ['grid_add', 'grid_sub', 'word_detective', 'clue_arena', 'print_sheet'];
    let curMode = 'grid_add';
    let problemIdx = 0;
    let score = 0;
    let streak = 0;
    let audioOn = true;
    let synth = null;
    let showPrintAnswers = false;
    let clueSubMode = 'rapid';
    let rapidCardQueue = [];
    let currentRapidCard = null;
    let binWords = [];
    let activeBinSelectedIdx = null;
    let chosenDetectiveOp = null;

    const $ = id => document.getElementById(id);
    const T = () => i18n.en;
    const shuffled = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const placeList = places => places.map(p => T().placesLong[p]).join(', ');
    const fmt = n => n.toLocaleString('en-US');

    function playTone(type) {
      if (!audioOn) return;
      try {
        if (!synth) synth = new Tone.PolySynth(Tone.Synth).toDestination();
        if (Tone.context.state !== 'running') Tone.start();
        if (type === 'correct') synth.triggerAttackRelease(["C5", "E5", "G5"], "16n");
        else if (type === 'wrong') synth.triggerAttackRelease(["F3", "Db3"], "16n");
        else if (type === 'pop') synth.triggerAttackRelease(["E4"], "32n");
      } catch (e) { /* audio is optional */ }
    }
    function celebrate(n) { try { confetti({ particleCount: n, spread: 60, origin: { y: 0.7 }, disableForReducedMotion: true }); } catch (e) { } }

    function updateScore(delta, ok) {
      if (ok === true) { score += delta; streak += 1; }
      else if (ok === false) streak = 0;
      $('scoreVal').textContent = score;
      $('streakVal').textContent = streak;
      if (window.TNQ) TNQ.progress(score, streak);
    }

    function setFeedback(el, kind, html) {
      el.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-900', 'border-emerald-400', 'bg-rose-100', 'text-rose-900', 'border-rose-400', 'bg-amber-100', 'text-amber-900', 'border-amber-400');
      const cls = { ok: ['bg-emerald-100', 'text-emerald-900', 'border-emerald-400'], bad: ['bg-rose-100', 'text-rose-900', 'border-rose-400'], warn: ['bg-amber-100', 'text-amber-900', 'border-amber-400'] }[kind];
      el.classList.add('border', ...cls);
      el.innerHTML = html;
    }

    function toggleAudio() {
      audioOn = !audioOn;
      $('audioIcon').textContent = audioOn ? '🔊' : '🔇';
      $('btnAudio').setAttribute('aria-pressed', String(audioOn));
    }
    function toggleFullScreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => { });
      else document.exitFullscreen?.();
    }

    function applyStaticI18n() {
      const t = T();
      document.querySelectorAll('[data-i18n]').forEach(el => { const v = t[el.dataset.i18n]; if (typeof v === 'string') el.textContent = v; });
      document.querySelectorAll('[data-i18n-attr]').forEach(el => {
        el.dataset.i18nAttr.split(',').forEach(pair => { const [attr, key] = pair.split(':'); if (typeof t[key] === 'string') el.setAttribute(attr, t[key]); });
      });
    }

    function styleTabs() {
      MODES.forEach(m => {
        const btn = $('tab_' + m);
        btn.className = 'mode-tab flex-1 min-w-[100px] touch-target py-2.5 px-3 rounded-xl text-xs sm:text-sm font-black transition ' +
          (m === curMode ? 'text-white bg-emerald-700 shadow-md' : 'text-slate-600 hover:text-slate-900');
        btn.setAttribute('aria-pressed', String(m === curMode));
      });
    }

    function switchMode(m) {
      curMode = m;
      problemIdx = 0;
      styleTabs();
      const arena = $('gameArena'), printSec = $('printArea'), ribbon = $('scoreRibbon');
      const printing = m === 'print_sheet';
      arena.classList.toggle('hidden', printing);
      ribbon.classList.toggle('hidden', printing);
      printSec.classList.toggle('hidden', !printing);
      printing ? renderPrintWorksheet(printSec) : renderCurrentProblem();
    }

    function renderCurrentProblem() {
      const arena = $('gameArena');
      arena.innerHTML = '';
      if (curMode === 'grid_add' || curMode === 'grid_sub') renderGridOperation(arena);
      else if (curMode === 'word_detective') renderWordDetective(arena);
      else if (curMode === 'clue_arena') renderClueArena(arena);
    }

    // =====================================================================
    // 5. GRID MODE
    // =====================================================================
    function currentGridProblem() {
      const isSub = curMode === 'grid_sub';
      const list = isSub ? fullSubtractionBank : fullAdditionBank;
      const p = list[problemIdx % list.length];
      return { p, isSub, list, sol: TNQMath.solve(p.num1, p.num2, isSub ? '-' : '+') };
    }

    function strategyTip(sol) {
      const t = T();
      if (sol.op === '+') return sol.regroupCount ? t.tipAddN(placeList(sol.regroupPlaces), sol.regroupCount) : t.tipAdd0;
      if (!sol.regroupCount) return t.tipSub0;
      return t.tipSubN(placeList(sol.regroupPlaces), sol.regroupCount) + (sol.acrossZero ? t.tipZero : '');
    }

    function renderGridOperation(container) {
      const { p, isSub, list, sol } = currentGridProblem();
      const s1 = String(p.num1).padStart(4, '0'), s2 = String(p.num2).padStart(4, '0');
      const t = T();
      const powers = [3, 2, 1, 0];
      const cellCls = 'grid-cell bg-white rounded-lg shadow-sm text-2xl math-font';
      container.innerHTML = `
        <div class="w-full max-w-md flex flex-col items-center">
          <div class="w-full flex items-center justify-between mb-2">
            <span class="text-xs font-bold uppercase tracking-wider text-emerald-800 bg-emerald-100 border border-emerald-300 px-3 py-1 rounded-full">${isSub ? t.subGrid : t.addGrid}</span>
            <span class="text-xs font-bold text-slate-500 font-mono">#${(problemIdx % list.length) + 1}/${list.length}</span>
          </div>
          <div class="w-full bg-slate-50 border-2 border-slate-300 rounded-2xl p-3 sm:p-5 shadow-sm relative mb-4">
            <div class="grid grid-cols-5 gap-1.5 text-center font-mono text-sm sm:text-base font-bold text-slate-700">
              <div class="text-[11px] uppercase tracking-wider font-extrabold text-slate-500 flex items-center justify-center">${t.col}</div>
              <div class="text-[11px] uppercase tracking-wider font-extrabold text-purple-700 bg-purple-50 rounded py-0.5">${t.places.thousands}</div>
              <div class="text-[11px] uppercase tracking-wider font-extrabold text-emerald-700 bg-emerald-50 rounded py-0.5">${t.places.hundreds}</div>
              <div class="text-[11px] uppercase tracking-wider font-extrabold text-amber-700 bg-amber-50 rounded py-0.5">${t.places.tens}</div>
              <div class="text-[11px] uppercase tracking-wider font-extrabold text-blue-700 bg-blue-50 rounded py-0.5">${t.places.ones}</div>

              <div class="text-[10px] text-slate-500 font-sans font-bold flex items-center justify-center">${isSub ? t.borrow : t.carry}</div>
              ${powers.map(pw => `<input type="text" inputmode="numeric" id="carry_${pw}" maxlength="2" autocomplete="off" aria-label="${t.markAria(isSub, t.placesLong[TNQMath.PLACES[pw]])}" class="w-full h-8 text-center bg-white border border-dashed border-rose-300 rounded text-rose-700 font-extrabold text-xs focus:bg-rose-50">`).join('')}

              <div></div>
              ${[...s1].map(d => `<div class="${cellCls}">${d}</div>`).join('')}

              <div class="flex items-center justify-center text-3xl font-black ${isSub ? 'text-rose-600' : 'text-emerald-600'}" aria-hidden="true">${isSub ? '−' : '+'}</div>
              ${[...s2].map(d => `<div class="${cellCls}">${d}</div>`).join('')}

              <div class="col-span-5 h-1 bg-slate-800 rounded-full my-1"></div>

              <div></div>
              ${powers.map(pw => `<input type="text" id="ans_${pw}" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="${t.ansAria(t.placesLong[TNQMath.PLACES[pw]])}" class="w-full h-12 text-center bg-white border-2 border-slate-300 focus:border-emerald-500 rounded-xl text-2xl math-font font-black shadow-sm" placeholder="?">`).join('')}
            </div>
          </div>
          <div class="w-full p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900 leading-relaxed font-semibold mb-4">
            <strong>💡 ${t.tipLabel}</strong> ${strategyTip(sol)}
          </div>
          <div class="w-full flex items-center justify-between gap-3">
            <button type="button" onclick="checkGridAnswer()" class="flex-1 touch-target py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-sm font-bold shadow-md transition active:scale-95">${t.checkBtn}</button>
            <button type="button" onclick="nextProblem()" class="touch-target px-5 py-3 bg-emerald-700 hover:bg-emerald-600 text-white rounded-xl text-sm font-bold shadow-md transition active:scale-95">${t.nextBtn}</button>
          </div>
          <div id="gridFeedback" role="status" aria-live="polite" class="w-full mt-3 p-3 rounded-xl hidden text-sm font-bold text-center"></div>
        </div>`;

      // Answers are written right-to-left (ones first), like on paper.
      const order = [0, 1, 2, 3];
      order.forEach((pw, i) => {
        const el = $('ans_' + pw);
        el.addEventListener('input', () => {
          el.value = el.value.replace(/\D/g, '');
          if (el.value.length === 1 && i < order.length - 1) $('ans_' + order[i + 1]).focus();
        });
      });
      setTimeout(() => $('ans_0') && $('ans_0').focus({ preventScroll: true }), 150);
    }

    function readGrid(prefix) { return [0, 1, 2, 3].map(pw => ($(prefix + pw) ? $(prefix + pw).value : '')); }

    // Returns {status, ...} so tests can drive it without the DOM.
    function evaluateGrid(sol, answerDigits, marks) {
      const ans = TNQMath.validateAnswer(sol, answerDigits);
      const mk = TNQMath.validateMarks(sol, marks);
      if (!ans.ok) return { status: 'wrong', firstWrong: ans.wrongPlaces[0], ans, mk };
      if (mk.unnecessary.length) return { status: 'unnecessary', ans, mk };
      if (mk.wrong.length) return { status: 'wrong-mark', ans, mk };
      return { status: 'correct', ans, mk };
    }
    window.evaluateGrid = evaluateGrid;

    function checkGridAnswer() {
      const { sol } = currentGridProblem();
      const r = evaluateGrid(sol, readGrid('ans_'), readGrid('carry_'));
      const fb = $('gridFeedback');
      const t = T();
      if (r.status === 'correct') {
        updateScore(10, true); playTone('correct'); celebrate(35);
        setFeedback(fb, 'ok', `🎉 ${t.correctMsg} (${sol.result})`);
      } else if (r.status === 'unnecessary') {
        playTone('wrong');
        const pl = placeList(r.mk.unnecessary);
        setFeedback(fb, 'warn', `⚠️ ${sol.op === '-' ? t.unnecessary(sol.result, pl) : t.unnecessaryAdd(sol.result, pl)}`);
      } else if (r.status === 'wrong-mark') {
        playTone('wrong');
        setFeedback(fb, 'warn', `⚠️ ${t.wrongMark(placeList(r.mk.wrong))}`);
      } else {
        updateScore(0, false); playTone('wrong');
        setFeedback(fb, 'bad', `❌ ${t.wrongMsg(t.placesLong[r.firstWrong])} ${t.expected} ${sol.result}`);
      }
      return r;
    }

    // =====================================================================
    // 6. WORD DETECTIVE MODE
    // =====================================================================
    function renderWordDetective(container) {
      chosenDetectiveOp = null;
      const item = fullWordBank[problemIdx % fullWordBank.length];
      const t = T();
      container.innerHTML = `
        <div class="w-full max-w-lg flex flex-col items-center">
          <div class="w-full flex items-center justify-between mb-3 gap-2">
            <span class="text-xs font-extrabold uppercase tracking-wider text-indigo-700 bg-indigo-50 border border-indigo-200 px-3 py-1 rounded-full">🕵️ ${t.clueDetectiveTitle}</span>
            <span class="text-xs font-mono font-bold text-slate-500">#${(problemIdx % fullWordBank.length) + 1}/${fullWordBank.length}</span>
          </div>
          <div class="w-full bg-slate-50 border-2 border-slate-300 rounded-3xl p-4 sm:p-6 mb-4 shadow-sm text-left">
            <div class="text-base sm:text-lg text-slate-800 leading-relaxed">${item.storyEn}</div>
            <div class="mt-3 text-xs bg-amber-100 text-amber-900 px-3 py-1.5 rounded-xl border border-amber-300 font-bold">
              ${t.clueDetected} <u>${item.clue}</u>
            </div>
          </div>
          <div class="w-full mb-4">
            <p class="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 text-center">${t.detectivePrompt}</p>
            <div class="grid grid-cols-2 gap-3">
              <button type="button" onclick="selectDetectiveOp('+')" id="btnOpAdd" aria-pressed="false" class="op-btn touch-target py-3.5 px-4 bg-white hover:bg-emerald-50 border-2 border-slate-300 hover:border-emerald-400 rounded-2xl text-base font-extrabold text-slate-800 transition active:scale-95 shadow-sm">${t.additionBtn}</button>
              <button type="button" onclick="selectDetectiveOp('-')" id="btnOpSub" aria-pressed="false" class="op-btn touch-target py-3.5 px-4 bg-white hover:bg-rose-50 border-2 border-slate-300 hover:border-rose-400 rounded-2xl text-base font-extrabold text-slate-800 transition active:scale-95 shadow-sm">${t.subtractionBtn}</button>
            </div>
          </div>
          <div id="step2CalcBox" class="w-full hidden bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-col items-center mb-4">
            <label for="wordCalcAns" class="text-xs font-bold text-slate-600 uppercase mb-2">${t.solveEquationLabel}</label>
            <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 text-xl sm:text-2xl font-mono font-bold">
              <span>${item.num1}</span><span id="activeOpSign" class="text-indigo-600 font-black">+</span><span>${item.num2}</span><span>=</span>
              <input type="number" id="wordCalcAns" inputmode="numeric" class="w-28 text-center px-2 py-1.5 border-2 border-indigo-400 rounded-xl text-2xl font-black bg-indigo-50" placeholder="?">
            </div>
          </div>
          <div class="w-full flex items-center justify-between gap-3">
            <button type="button" onclick="checkDetectiveAnswer()" class="flex-1 touch-target py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-sm font-bold shadow-md transition active:scale-95">${t.checkBtn}</button>
            <button type="button" onclick="nextProblem()" class="touch-target px-5 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-bold shadow-md transition active:scale-95">${t.nextBtn}</button>
          </div>
          <div id="wordFeedback" role="status" aria-live="polite" class="w-full mt-3 p-3 rounded-xl hidden text-sm font-bold text-center"></div>
        </div>`;
    }

    function selectDetectiveOp(op) {
      chosenDetectiveOp = op;
      playTone('pop');
      const on = 'op-btn touch-target py-3.5 px-4 text-white border-2 rounded-2xl text-base font-extrabold shadow-md scale-105 transition ';
      const off = 'op-btn touch-target py-3.5 px-4 bg-white opacity-60 border-2 border-slate-300 rounded-2xl text-base font-extrabold text-slate-800 transition';
      $('btnOpAdd').className = op === '+' ? on + 'bg-emerald-600 border-emerald-500' : off;
      $('btnOpSub').className = op === '-' ? on + 'bg-rose-600 border-rose-500' : off;
      $('btnOpAdd').setAttribute('aria-pressed', String(op === '+'));
      $('btnOpSub').setAttribute('aria-pressed', String(op === '-'));
      $('activeOpSign').textContent = op === '-' ? '−' : '+';
      $('step2CalcBox').classList.remove('hidden');
      setTimeout(() => $('wordCalcAns')?.focus(), 100);   // view may have changed meanwhile
    }

    // Operation truth comes from the clue classifier, not from the hand-entered `op`.
    function evaluateDetective(item, chosenOp, value) {
      const clue = TNQMath.classifyClue(item.storyEn);
      const expected = clue.op === '+' ? item.num1 + item.num2 : item.num1 - item.num2;
      if (!chosenOp) return { status: 'no-op', clue };
      if (chosenOp !== clue.op) return { status: 'op-rejected', clue, expected };
      if (value !== expected) return { status: 'calc-wrong', clue, expected };
      return { status: 'correct', clue, expected };
    }
    window.evaluateDetective = evaluateDetective;

    function checkDetectiveAnswer() {
      const item = fullWordBank[problemIdx % fullWordBank.length];
      const r = evaluateDetective(item, chosenDetectiveOp, parseInt($('wordCalcAns') ? $('wordCalcAns').value : '', 10));
      const fb = $('wordFeedback');
      const t = T();
      const clueShown = r.clue.phrase;
      if (r.status === 'no-op') return setFeedback(fb, 'bad', t.pickOpFirst);
      if (r.status === 'correct') {
        updateScore(15, true); playTone('correct'); celebrate(40);
        setFeedback(fb, 'ok', t.detectiveWin(r.clue.op === '-' ? '−' : '+', r.expected));
      } else if (r.status === 'op-rejected') {
        updateScore(0, false); playTone('wrong');
        setFeedback(fb, 'bad', t.opMismatch(clueShown, r.clue.op));
      } else {
        updateScore(0, false); playTone('wrong');
        setFeedback(fb, 'bad', t.calcWrong(r.expected));
      }
    }

    // =====================================================================
    // 7. CLUE ARENA (Rapid Sort, Drop Bins, Vault)
    // =====================================================================
    const subTabCls = active => 'flex-1 py-1.5 rounded-lg transition ' + (active ? 'bg-white shadow text-slate-900' : 'text-slate-600 hover:text-slate-900');

      const t = T();
      container.innerHTML = `
        <div class="w-full flex flex-col items-center">
          <div class="w-full max-w-md flex items-center justify-center gap-1.5 bg-slate-100 p-1.5 rounded-xl border border-slate-300 mb-5 text-xs font-extrabold">
            ${['rapid', 'bins', 'vault'].map(s => `<button type="button" onclick="setClueSubMode('${s}')" id="sub_${s}" aria-pressed="${clueSubMode === s}" class="${subTabCls(clueSubMode === s)}">${t[{ rapid: 'arenaRapidTab', bins: 'arenaBinsTab', vault: 'arenaVaultTab' }[s]]}</button>`).join('')}
          </div>
          <div id="clueSubContainer" class="w-full flex flex-col items-center"></div>
        </div>`;
      renderActiveClueSubView();
    }

    function setClueSubMode(sub) {
      clueSubMode = sub;
      ['rapid', 'bins', 'vault'].forEach(s => {
        const btn = $('sub_' + s);
        if (btn) { btn.className = subTabCls(clueSubMode === s); btn.setAttribute('aria-pressed', String(clueSubMode === s)); }
      });
      renderActiveClueSubView();
    }

    function renderActiveClueSubView() {
      const sub = $('clueSubContainer');
      if (!sub) return;
      sub.innerHTML = '';
      if (clueSubMode === 'rapid') {
        if (!rapidCardQueue.length) rapidCardQueue = shuffled(clueBank);
        currentRapidCard = rapidCardQueue.pop();
        renderRapidCardView(sub);
      } else if (clueSubMode === 'bins') {
        binWords = shuffled(clueBank).slice(0, 6);   // never mutate the master bank
        activeBinSelectedIdx = null;
        renderBinsView(sub);
      } else renderVaultView(sub);
    }

    const word = w => w.en;

    function renderRapidCardView(container) {
      const t = T();
      container.innerHTML = `
        <div class="w-full max-w-md flex flex-col items-center select-none">
          <div class="text-xs font-bold uppercase tracking-wider text-indigo-700 bg-indigo-50 border border-indigo-200 px-3 py-1 rounded-full mb-3 text-center">${t.whichOpSignals}</div>
          <div class="pop-card w-full h-44 bg-slate-900 text-white rounded-3xl p-6 flex flex-col items-center justify-center text-center shadow-xl border-4 border-slate-700 mb-5">
            <span class="text-xs uppercase font-extrabold tracking-widest text-amber-400 mb-1">${t.wordClue}</span>
            <div class="text-3xl sm:text-4xl font-black tracking-tight leading-tight px-2 text-white">“${word(currentRapidCard)}”</div>
          </div>
          <div class="w-full grid grid-cols-2 gap-4">
            <button type="button" onclick="handleRapidSortAnswer('+')" class="touch-target h-20 bg-emerald-700 hover:bg-emerald-600 text-white rounded-2xl flex flex-col items-center justify-center shadow-lg active:scale-95 transition border-b-4 border-emerald-900">
              <span class="text-2xl font-black" aria-hidden="true">➕</span><span class="text-xs sm:text-sm font-extrabold uppercase mt-0.5">${t.addPrompt}</span>
            </button>
            <button type="button" onclick="handleRapidSortAnswer('-')" class="touch-target h-20 bg-rose-700 hover:bg-rose-600 text-white rounded-2xl flex flex-col items-center justify-center shadow-lg active:scale-95 transition border-b-4 border-rose-900">
              <span class="text-2xl font-black" aria-hidden="true">➖</span><span class="text-xs sm:text-sm font-extrabold uppercase mt-0.5">${t.subPrompt}</span>
            </button>
          </div>
          <div id="rapidFeedback" role="status" aria-live="polite" class="w-full mt-4 p-3 rounded-xl hidden text-xs sm:text-sm font-bold text-center"></div>
        </div>`;
    }

    function handleRapidSortAnswer(chosenOp) {
      const fb = $('rapidFeedback');
      if (!fb || !currentRapidCard) return;
      const t = T();
      const ok = chosenOp === currentRapidCard.op;
      const note = currentRapidCard.noteEn;
      const opName = t.opName(currentRapidCard.op);
      if (ok) { updateScore(10, true); playTone('correct'); celebrate(30); }
      else { updateScore(0, false); playTone('wrong'); }
      setFeedback(fb, ok ? 'ok' : 'bad', `${ok ? '🎉' : '❌'} <strong>${ok ? t.correctToast : t.wrongToast}</strong> ${(ok ? t.rapidRight : t.rapidWrong)(word(currentRapidCard), opName)}<br><span class="text-xs opacity-80">${note}</span>`);
      setTimeout(() => { if (curMode === 'clue_arena' && clueSubMode === 'rapid') renderActiveClueSubView(); }, 1300);
    }

    function renderBinsView(container) {
      const t = T();
      container.innerHTML = `
        <div class="w-full max-w-3xl flex flex-col items-center">
          <div class="text-xs font-bold uppercase tracking-wider text-slate-600 mb-3 text-center">${t.binsHelp}</div>
          <div class="flex flex-wrap gap-2.5 justify-center mb-6 min-h-[80px] p-3 bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl w-full" id="unsortedBank">
            ${binWords.map((w, idx) => `<button type="button" onclick="selectBinWordPill(${idx})" id="wordPill_${idx}" aria-pressed="false" class="touch-target px-4 py-2 bg-white hover:bg-amber-50 border-2 border-slate-300 hover:border-amber-400 rounded-xl font-bold text-sm shadow-sm transition active:scale-95 text-slate-800">${word(w)}</button>`).join('')}
          </div>
          <div class="w-full grid grid-cols-1 sm:grid-cols-2 gap-4">
            <button type="button" onclick="dropWordInBin('+')" id="binAdd" class="touch-target p-4 bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-400 rounded-2xl flex flex-col items-center text-center transition active:scale-95 shadow-sm">
              <span class="text-3xl font-black text-emerald-600 mb-1" aria-hidden="true">➕</span>
              <span class="text-base font-black text-emerald-900">${t.addPrompt}</span>
              <span class="text-[11px] text-emerald-800 mt-1">${t.binAddHelp}</span>
              <span class="mt-3 flex flex-wrap gap-1.5 justify-center w-full" id="binAddItems"></span>
            </button>
            <button type="button" onclick="dropWordInBin('-')" id="binSub" class="touch-target p-4 bg-rose-50 hover:bg-rose-100 border-2 border-rose-400 rounded-2xl flex flex-col items-center text-center transition active:scale-95 shadow-sm">
              <span class="text-3xl font-black text-rose-600 mb-1" aria-hidden="true">➖</span>
              <span class="text-base font-black text-rose-900">${t.subPrompt}</span>
              <span class="text-[11px] text-rose-800 mt-1">${t.binSubHelp}</span>
              <span class="mt-3 flex flex-wrap gap-1.5 justify-center w-full" id="binSubItems"></span>
            </button>
          </div>
          <div id="binFeedback" role="status" aria-live="polite" class="w-full mt-4 p-2.5 rounded-xl hidden text-xs font-bold text-center"></div>
        </div>`;
    }

    function selectBinWordPill(idx) {
      playTone('pop');
      activeBinSelectedIdx = idx;
      binWords.forEach((_, i) => {
        const el = $('wordPill_' + i);
        if (!el) return;
        el.setAttribute('aria-pressed', String(i === idx));
        el.className = i === idx
          ? 'touch-target px-4 py-2 bg-amber-400 text-slate-900 border-2 border-amber-600 rounded-xl font-black text-sm shadow-md scale-105 transition'
          : 'touch-target px-4 py-2 bg-white hover:bg-amber-50 border-2 border-slate-300 rounded-xl font-bold text-sm shadow-sm transition text-slate-800';
      });
    }

    function dropWordInBin(targetOp) {
      if (activeBinSelectedIdx === null) return;
      const w = binWords[activeBinSelectedIdx];
      const t = T();
      const fb = $('binFeedback');
      if (w.op === targetOp) {
        updateScore(10, true); playTone('correct');
        const pill = $('wordPill_' + activeBinSelectedIdx);
        if (pill) pill.remove();
        const badge = document.createElement('span');
        badge.className = 'text-xs font-extrabold px-2.5 py-1 bg-white border rounded-lg';
        badge.textContent = '✓ ' + word(w);
        $(targetOp === '+' ? 'binAddItems' : 'binSubItems').appendChild(badge);
        setFeedback(fb, 'ok', t.binRight(word(w), t.opName(targetOp)));
        activeBinSelectedIdx = null;
        if ($('unsortedBank').children.length === 0) { celebrate(50); setTimeout(renderActiveClueSubView, 1200); }
      } else {
        updateScore(0, false); playTone('wrong');
        setFeedback(fb, 'bad', t.binWrong(word(w), t.opName(w.op)));
      }
    }

    function renderVaultView(container) {
      const t = T();
      const col = (items, tone, heading) => `
        <div class="bg-${tone}-50/70 border-2 border-${tone}-300 rounded-2xl p-4 shadow-sm">
          <h3 class="text-${tone}-800 font-black text-lg mb-2">${heading}</h3>
          <ul class="space-y-1.5">
            ${items.map(item => `<li class="p-2 bg-white border border-${tone}-200 rounded-xl"><div class="font-extrabold text-sm text-${tone}-950">${word(item)}</div><div class="text-[11px] text-slate-600 font-medium">${item.noteEn}</div></li>`).join('')}
          </ul>
        </div>`;
      container.innerHTML = `
        <div class="w-full max-w-4xl flex flex-col text-left">
          <div class="border-b-2 border-slate-200 pb-3 mb-4">
            <h2 class="text-xl sm:text-2xl font-black text-slate-900">${t.vaultTitle}</h2>
            <p class="text-xs text-slate-600 mt-1">${t.vaultDesc}</p>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${col(clueBank.filter(c => c.op === '+'), 'emerald', t.vaultAdd)}
            ${col(clueBank.filter(c => c.op === '-'), 'rose', t.vaultSub)}
          </div>
        </div>`;
    }

    // =====================================================================
    // 8. PRINTABLE WORKSHEET GENERATOR (10 + 10 + 10)
    // =====================================================================
    function renderPrintWorksheet(container) {
      const t = T();
      const part = (title, body) => `
        <div class="print-page mb-8">
          <div class="flex items-center justify-between border-b-2 border-slate-800 pb-1 mb-4 gap-2">
            <h3 class="font-black text-lg text-slate-900">${title}</h3>
            <span class="text-xs font-mono font-bold text-slate-600 whitespace-nowrap">${t.points}</span>
          </div>
          ${body}
        </div>`;
      container.innerHTML = `
        <div class="w-full flex flex-col">
          <div class="w-full flex flex-wrap items-center justify-between gap-2 pb-4 mb-6 border-b border-slate-300 no-print">
            <button type="button" onclick="togglePrintAnswers()" aria-pressed="${showPrintAnswers}" class="touch-target px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold rounded-xl text-xs sm:text-sm border border-slate-300 transition">
              🔑 ${showPrintAnswers ? t.btnHideAns : t.btnShowAns}
            </button>
            <button type="button" onclick="window.print()" class="touch-target px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs sm:text-sm shadow-md transition active:scale-95">🖨️ ${t.btnPrintNow}</button>
          </div>
          <div class="w-full border-b-2 border-slate-900 pb-4 mb-6">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <span class="text-xs font-black uppercase tracking-wider text-slate-500">${t.printKicker}</span>
                <h2 class="text-2xl sm:text-3xl font-black text-slate-900">${t.printDocTitle}</h2>
              </div>
              <div class="text-lg font-black font-mono text-slate-800">${t.printScore}</div>
            </div>
            <div class="grid grid-cols-2 gap-4 text-xs sm:text-sm font-bold text-slate-700 pt-2 border-t border-slate-200">
              <div class="flex items-end gap-2"><span>${t.printName}</span><div class="flex-1 border-b border-slate-500 pb-0.5"></div></div>
              <div class="flex items-end gap-2"><span>${t.printDate}</span><div class="flex-1 border-b border-slate-500 pb-0.5"></div></div>
            </div>
          </div>
          ${part(t.printPart1, `<div class="print-grid grid grid-cols-2 sm:grid-cols-5 gap-3">${fullAdditionBank.map((it, i) => renderPrintGridItem(it, i, '+')).join('')}</div>`)}
          ${part(t.printPart2, `<div class="print-grid grid grid-cols-2 sm:grid-cols-5 gap-3">${fullSubtractionBank.map((it, i) => renderPrintGridItem(it, i, '-')).join('')}</div>`)}
          ${part(t.printPart3, `<div class="space-y-4">${fullWordBank.map((item, idx) => `
              <div class="print-box border border-slate-300 rounded-xl p-3.5 bg-white text-xs sm:text-sm">
                <div class="font-semibold text-slate-800 mb-2 leading-relaxed"><strong>${idx + 1})</strong> ${item.storyEn}</div>
                <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-dashed border-slate-200">
                  <div class="flex items-center gap-2"><span class="text-slate-600 font-bold">${t.workspace}</span>
                    <span class="math-font text-blue-700 font-bold text-base">${showPrintAnswers ? `${item.num1} ${item.op === '-' ? '−' : '+'} ${item.num2}` : ''}</span></div>
                  <div class="flex items-center gap-2"><span class="text-slate-600 font-bold">${t.answer}</span>
                    <span class="border-b-2 border-slate-700 w-24 text-center font-black math-font text-blue-700 text-base">${showPrintAnswers ? item.ans : ''}</span></div>
                </div>
              </div>`).join('')}</div>`)}
        </div>`;
    }

    function renderPrintGridItem(p, idx, op) {
      const sol = TNQMath.solve(p.num1, p.num2, op);
      const s1 = String(p.num1).padStart(4, '0'), s2 = String(p.num2).padStart(4, '0');
      const ansStr = String(sol.result).padStart(4, '0');
      const marks = [3, 2, 1, 0].map(pw => sol.marks[pw]);
      const cell = 'h-6 flex items-center justify-center math-font text-blue-700 text-sm font-black';
      return `
        <div class="print-box border border-slate-300 rounded-xl p-2 bg-slate-50/50 flex flex-col justify-between">
          <div class="flex items-center justify-between text-[10px] font-bold text-slate-600 mb-1"><span>#${idx + 1}</span><span aria-hidden="true">${op === '-' ? '−' : '+'}</span></div>
          <div class="grid grid-cols-4 gap-0.5 text-center font-mono text-xs font-bold border border-slate-300 bg-white p-1 rounded">
            ${marks.map(m => `<div class="h-4 border-b border-dashed border-slate-200 text-[9px] text-rose-600">${showPrintAnswers ? m : ''}</div>`).join('')}
            ${[...s1].map(d => `<div>${d}</div>`).join('')}
            <div class="relative"><span class="absolute -left-2 text-[10px] text-slate-700">${op === '-' ? '−' : '+'}</span>${s2[0]}</div>
            ${[...s2.slice(1)].map(d => `<div>${d}</div>`).join('')}
            <div class="col-span-4 h-0.5 bg-slate-900 my-0.5"></div>
            ${[...ansStr].map(d => `<div class="${cell}">${showPrintAnswers ? d : ''}</div>`).join('')}
          </div>
        </div>`;
    }

    function togglePrintAnswers() { showPrintAnswers = !showPrintAnswers; renderPrintWorksheet($('printArea')); }
    function nextProblem() { problemIdx++; renderCurrentProblem(); }

    // =====================================================================
    // 9. KEYBOARD + BOOT
    // =====================================================================
    window.addEventListener('keydown', (e) => {
      const typing = e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
      if ((e.key === 'f' || e.key === 'F') && !typing) toggleFullScreen();
      if (curMode === 'clue_arena' && clueSubMode === 'rapid' && !typing) {
        if (e.key === 'ArrowLeft') handleRapidSortAnswer('+');
        if (e.key === 'ArrowRight') handleRapidSortAnswer('-');
      }
      if (e.key === 'Enter' && (curMode === 'grid_add' || curMode === 'grid_sub')) checkGridAnswer();
    });

    applyStaticI18n();
    styleTabs();
    renderCurrentProblem();
  </script>
</body>

</html>
