<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The True North Quest | Grade 4 &amp; 5 Learning Hub</title>
  <meta name="description" content="Interactive Grade 4 & 5 Canadian Social Studies and Mathematics activities. Works offline." />
  <meta name="theme-color" content="#0f172a" />
  <!-- PWA / home-screen install (specs/SPEC-CORE.md §6) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="True North" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <style>
    /* Spec: specs/SPEC-CORE.md §4 (viewport contract). Breakpoint: 1024px. */
    :root {
      --sidebar-w: 320px;
      --header-h: 64px;
      --toolbar-h: 48px;
      --primary: #c51d24;
      --bg: #0f172a;
      --sidebar-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #a3b1c6;
      --border: #475569;
      --active: #0369a1;
      --focus: #fbbf24;
      --font-ui: 'Segoe UI', 'SF Pro Text', 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    .skip-link {
      position: absolute; left: 8px; top: -60px; z-index: 1000;
      background: var(--focus); color: #111827; font-weight: 800;
      padding: 10px 14px; border-radius: 8px; text-decoration: none;
    }
    .skip-link:focus { top: 8px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    /* ---------- Global header ---------- */
    header.app-header {
      /* Installed on iOS the status bar overlays the page (black-translucent): pad for the notch. */
      height: calc(var(--header-h) + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      flex-shrink: 0;
      background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 2px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 0 16px;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      position: relative; z-index: 30;
    }
    .brand-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-logo { font-size: 1.7rem; line-height: 1; }
    .brand-title { margin: 0; font-size: 1.2rem; font-weight: 800; color: #38bdf8; white-space: nowrap; }
    .brand-sub { margin: 0; font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .badge-site {
      background: var(--primary); color: #fff; font-weight: 800; font-size: 0.78rem;
      padding: 4px 10px; border-radius: 9999px; letter-spacing: 0.4px; white-space: nowrap;
    }

    .tool-btn {
      background: #334155; border: 1px solid var(--border); color: var(--text);
      min-height: 36px; padding: 5px 12px; border-radius: 8px;
      font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      transition: background 0.2s;
    }
    .tool-btn:hover { background: #475569; }
    .tool-btn[aria-pressed="true"] { background: var(--active); border-color: #38bdf8; }

    /* ---------- Workspace (multi-pane on desktop) ---------- */
    .studio-workspace { display: flex; flex: 1; min-height: 0; position: relative; }

    aside#sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
      transition: margin-left 0.25s ease, transform 0.25s ease;
    }
    body.sidebar-collapsed aside#sidebar { margin-left: calc(-1 * var(--sidebar-w)); visibility: hidden; }

    .sidebar-header {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      color: var(--text-muted); display: flex; justify-content: space-between; align-items: center;
    }
    .drawer-close { display: none; }
    .nav-scroll { flex: 1; overflow-y: auto; padding: 8px 12px 24px; overscroll-behavior: contain; }
    .nav-section-title {
      font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.1px;
      color: #38bdf8; margin: 16px 0 8px 8px;
    }
    .nav-list { list-style: none; margin: 0; padding: 0; }
    .lesson-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; min-height: 44px; border-radius: 8px;
      color: #d5dde8; text-decoration: none; margin-bottom: 4px; border: 1px solid transparent;
      transition: background 0.2s, transform 0.2s;
    }
    .lesson-item:hover { background: rgba(255, 255, 255, 0.06); color: #fff; transform: translateX(3px); }
    .lesson-item[aria-current="page"] {
      background: var(--active); color: #fff; font-weight: 700;
      border-color: #38bdf8; box-shadow: 0 0 12px rgba(3, 105, 161, 0.45);
    }
    .lesson-icon { font-size: 1.3rem; flex-shrink: 0; }
    .lesson-text { min-width: 0; }
    .lesson-text h3 { margin: 0; font-size: 0.95rem; font-weight: inherit; }
    .lesson-text p { margin: 2px 0 0; font-size: 0.76rem; color: var(--text-muted); }
    .lesson-item[aria-current="page"] .lesson-text p { color: #e0f2fe; }

    /* ---------- Stage ---------- */
    main.viewport-stage { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #0b1120; }
    .stage-toolbar {
      height: var(--toolbar-h); flex-shrink: 0;
      background: #1e293b; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px;
    }
    .stage-title-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .stage-title { margin: 0; font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .curriculum-tag {
      font-size: 0.7rem; font-weight: 800; padding: 2px 8px; border-radius: 4px;
      background: #047857; color: #ecfdf5; white-space: nowrap;
    }
    .score-chip { font-size: 0.75rem; font-weight: 800; color: #fde68a; white-space: nowrap; }
    .toolbar-actions { display: flex; gap: 6px; flex-shrink: 0; }
    /* overflow:auto is a safety net for older iOS WebKit, which sizes iframes to their content. */
    .iframe-holder {
      flex: 1; min-height: 0; position: relative; background: #fff;
      overflow: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    }
    iframe#stageFrame { width: 100%; height: 100%; border: 0; display: block; }
    .stage-loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #f8fafc; color: #334155; font-weight: 700; font-size: 0.95rem;
      transition: opacity 0.2s; pointer-events: none;
    }
    .stage-loading[hidden] { display: none; }

    .backdrop {
      display: none; position: fixed; inset: 0; z-index: 40;
      background: rgba(15, 23, 42, 0.55);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }

    /* ---------- Mobile / tablet-portrait: drawer contract ---------- */
    @media (max-width: 1023.98px) {
      aside#sidebar {
        position: fixed; z-index: 50; top: 0; bottom: 0; left: 0;
        width: min(86vw, var(--sidebar-w));
        transform: translateX(-100%); visibility: hidden;
        box-shadow: 8px 0 24px rgba(0, 0, 0, 0.45);
        padding-left: env(safe-area-inset-left);
      }
      body.sidebar-collapsed aside#sidebar { margin-left: 0; }
      aside#sidebar { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
      body.drawer-open aside#sidebar { transform: translateX(0); visibility: visible; }
      body.drawer-open .backdrop { display: block; }
      .drawer-close { display: inline-flex; }
    }
    @media (max-width: 640px) {
      .badge-site, .brand-sub, .curriculum-tag, .btn-label { display: none; }
      .brand-title { font-size: 1.05rem; }
      .tool-btn { padding: 5px 9px; }
    }
    @media (max-width: 380px) {
      .score-chip { display: none; }
      .brand-logo { font-size: 1.4rem; }
    }
    /* Touch screens: WCAG 2.5.5 target size (44 px) for every hub control. */
    @media (pointer: coarse) {
      .tool-btn { min-height: 44px; min-width: 44px; justify-content: center; font-size: 1.2rem; }
      .tool-btn .btn-label { font-size: 0.85rem; }
      .lesson-item { min-height: 52px; }
      .lesson-item:hover { transform: none; }
    }
    .install-hint {
      margin: 8px 12px 12px; padding: 10px 12px; border-radius: 8px;
      background: #0b1120; border: 1px dashed var(--border); color: var(--text-muted); font-size: 0.8rem;
    }
    .install-hint[hidden] { display: none; }
    .stage-toolbar { -webkit-user-select: none; user-select: none; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    @media print {
      header.app-header, aside#sidebar, .stage-toolbar, .backdrop { display: none !important; }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#stageFrame">Skip to activity</a>

  <header class="app-header">
    <div class="brand-wrap">
      <button class="tool-btn" id="menuToggle" type="button" aria-controls="sidebar" aria-expanded="true"
        title="Show or hide the lesson list">☰ <span class="btn-label">Menu</span></button>
      <span class="brand-logo" aria-hidden="true">🍁</span>
      <div style="min-width:0">
        <h1 class="brand-title">The True North Quest</h1>
        <p class="brand-sub">Interactive Elementary Learning Hub • Grades 4 &amp; 5</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="tool-btn" id="installBtn" type="button" hidden title="Install as an app on this device">📲 <span class="btn-label">Install</span></button>
      <span class="badge-site">TheTrueNorthQuest.com</span>
    </div>
  </header>

  <div class="studio-workspace">
    <aside id="sidebar" aria-label="Lesson modules">
      <div class="sidebar-header">
        <span>Lesson Modules · <span id="moduleCount" style="color:#38bdf8;"></span></span>
        <button class="tool-btn drawer-close" id="drawerClose" type="button" aria-label="Close lesson list">✕</button>
      </div>
      <nav class="nav-scroll" id="navModuleList" aria-label="Lessons"></nav>
      <p class="install-hint" id="iosHint" hidden>📲 Install on iPhone/iPad: tap <strong>Share</strong> then <strong>Add to Home Screen</strong>. It then works offline.</p>
    </aside>

    <main class="viewport-stage" id="stage">
      <div class="stage-toolbar">
        <div class="stage-title-wrap">
          <h2 id="currentLessonTitle" class="stage-title">Loading…</h2>
          <span id="currentCurriculum" class="curriculum-tag"></span>
          <span id="scoreChip" class="score-chip" aria-live="polite"></span>
        </div>
        <div class="toolbar-actions">
          <button class="tool-btn" type="button" id="btnPrint" title="Print this activity">🖨️ <span class="btn-label">Print</span></button>
          <button class="tool-btn" type="button" id="btnReload" title="Restart activity">🔄 <span class="btn-label">Reload</span></button>
          <button class="tool-btn" type="button" id="btnStandalone" title="Open in a new window">↗ <span class="btn-label">Open Standalone</span></button>
        </div>
      </div>
      <div class="iframe-holder">
        <iframe id="stageFrame" title="Lesson activity" allow="fullscreen; autoplay" allowfullscreen></iframe>
        <div class="stage-loading" id="stageLoading" role="status">Loading activity…</div>
      </div>
    </main>
  </div>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <noscript><p style="padding:16px">The True North Quest needs JavaScript. Each activity can also be opened directly from the project folder.</p></noscript>

  <script>
    // =========================================================================
    // LESSONS REGISTRY: single source of truth (specs/SPEC-MODULES.md).
    // `id` must be unique and is used for #/deep-links. `file` is relative to this page.
    // After adding a module run `npm run boot` to stamp its offline loader.
    // =========================================================================
    const LESSONS_REGISTRY = [
      {
        category: "🍁 Social Studies: Canada",
        items: [
          { id: "canada_capitals", title: "Capitals Quest & Flashcards", desc: "Postal codes, map quiz, 3D flip cards & printables", file: "canada_capitals_game.html", icon: "🏛️", curriculum: "Social Studies: B3.4, B3.7" },
          { id: "car_driver", title: "Car Driving Practice", desc: "Animated car & directional arrows", file: "canada_car_driving_box_map.html", icon: "🚗", curriculum: "Social Studies: B3.4, B3.7" },
          { id: "box_vector_map", title: "Visual Vector Box Map", desc: "Schematic cheat-sheet with clear icons", file: "canada_box_map_vector_icons.html", icon: "🗺️", curriculum: "Social Studies: B3.4, B3.5" },
          { id: "cardinal_studio", title: "Cardinal Directions Studio", desc: "Rotating compass & speed flight game", file: "cardinal_directions_studio.html", icon: "🧭", curriculum: "Social Studies: B3.7" },
          { id: "canada_complete", title: "Canada Complete Study Hub", desc: "Density simulator, mnemonics & quiz", file: "canada_complete_grade4_hub.html", icon: "🌎", curriculum: "Social Studies: B3.4, B3.5, B3.7" }
        ]
      },
      {
        category: "🔢 Mathematics: Number Sense",
        items: [
          { id: "number_sense", title: "Number Sense Studio", desc: "Place value, MAB blocks & number words", file: "number_sense_studio.html", icon: "🧠", curriculum: "Math: B1.1, B1.2" },
          { id: "column_ops", title: "Operation Grid & Word Quest", desc: "4-digit regrouping & clue-word detective", file: "column_ops_word_quest.html", icon: "🧮", curriculum: "Math: B2.4, B2.5" },
          { id: "mental_math", title: "Mental Math Arena", desc: "Speed arithmetic & calculation drills", file: "mental_math_studio.html", icon: "⚡", curriculum: "Math: B2.1, B2.2" },
          { id: "rounding_line", title: "Rounding Number Line", desc: "Distance brackets to 10, 100 & 1000", file: "rounding_number_line.html", icon: "📏", curriculum: "Math: B1.3" },
          { id: "carpet_rounding", title: "Carpet Rolling Rounding", desc: "Midpoint momentum & effort meters", file: "carpet_rolling_rounding.html", icon: "🧶", curriculum: "Math: B1.3" }
        ]
      },
      {
        category: "🖨️ Printable Worksheet Generators",
        items: [
          { id: "quiz_gen", title: "Number Sense Quiz Generator", desc: "Generate custom printed student quizzes", file: "printable_number_sense_quiz_generator.html", icon: "📄", curriculum: "Assessment Tool" }
        ]
      }
    ];

    // ------------------------------------------------------------------ state
    const ALL = LESSONS_REGISTRY.flatMap(g => g.items);
    const byId = new Map(ALL.map(i => [i.id, i]));
    const byModule = new Map(ALL.map(i => [i.file.replace(/\.html?$/i, ''), i]));
    const DESKTOP = window.matchMedia('(min-width: 1024px)');
    const $ = id => document.getElementById(id);
    const frame = $('stageFrame');
    const state = { active: null, moduleInfo: null };

    if (byId.size !== ALL.length) console.warn('[TNQ] LESSONS_REGISTRY contains duplicate ids');

    // ---------------------------------------------------------------- sidebar
    function buildSidebar() {
      const nav = $('navModuleList');
      nav.textContent = '';
      LESSONS_REGISTRY.forEach((group, gi) => {
        const title = document.createElement('h2');
        title.className = 'nav-section-title';
        title.id = 'navgroup-' + gi;
        title.textContent = group.category;
        const ul = document.createElement('ul');
        ul.className = 'nav-list';
        ul.setAttribute('aria-labelledby', title.id);
        group.items.forEach(item => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.className = 'lesson-item';
          a.href = '#/' + item.id;
          a.dataset.id = item.id;
          a.innerHTML = '<span class="lesson-icon" aria-hidden="true"></span><div class="lesson-text"><h3></h3><p></p></div>';
          a.querySelector('.lesson-icon').textContent = item.icon;
          a.querySelector('h3').textContent = item.title;
          a.querySelector('p').textContent = item.desc;
          li.appendChild(a);
          ul.appendChild(li);
        });
        nav.append(title, ul);
      });
      $('moduleCount').textContent = ALL.length + ' modules';
    }

    function syncSidebar(item) {
      document.querySelectorAll('.lesson-item').forEach(a => {
        if (a.dataset.id === item.id) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });
      $('currentLessonTitle').textContent = item.title;
      $('currentCurriculum').textContent = 'Curriculum: ' + item.curriculum;
      document.title = item.title + ' | The True North Quest';
      frame.title = item.title + ' activity';
    }

    // ---------------------------------------------------------------- iframe lifecycle
    // idle -> loading (src set) -> loaded (load event) -> ready (tnq:ready) ; any -> loading on navigate
    function loadLesson(item, { push = true } = {}) {
      if (!item) item = ALL[0];
      state.active = item;
      state.moduleInfo = null;
      syncSidebar(item);
      $('scoreChip').textContent = '';
      $('stageLoading').hidden = false;
      frame.src = item.file;
      if (push && location.hash !== '#/' + item.id) history.replaceState(null, '', '#/' + item.id);
      closeDrawer({ restoreFocus: false });
    }

    frame.addEventListener('load', () => {
      $('stageLoading').hidden = true;
      // Same-origin navigations inside the frame (http(s) only) resync the sidebar.
      try {
        const name = frame.contentWindow.location.pathname.split('/').pop().replace(/\.html?$/i, '');
        const item = byModule.get(name);
        if (item && item !== state.active) { state.active = item; syncSidebar(item); history.replaceState(null, '', '#/' + item.id); }
      } catch (e) { /* file:// or cross-origin: rely on tnq:ready instead */ }
    });

    function postToFrame(type, data) {
      const target = location.protocol === 'file:' ? '*' : location.origin;
      try { frame.contentWindow.postMessage(Object.assign({ tnq: 1, type }, data || {}), target); } catch (e) { }
    }

    window.addEventListener('message', (e) => {
      const m = e.data;
      if (e.source !== frame.contentWindow || !m || m.tnq !== 1 || typeof m.type !== 'string') return;
      if (location.protocol !== 'file:' && e.origin !== location.origin) return;
      switch (m.type) {
        case 'tnq:ready': {
          $('stageLoading').hidden = true;
          state.moduleInfo = m;
          const item = byModule.get(String(m.module));
          if (item && item !== state.active) { state.active = item; syncSidebar(item); history.replaceState(null, '', '#/' + item.id); }
          break;
        }
        case 'tnq:progress':
          if (Number.isFinite(m.score)) $('scoreChip').textContent = '⭐ ' + m.score + (Number.isFinite(m.streak) && m.streak > 1 ? ' · 🔥 ' + m.streak : '');
          break;
      }
    });


    // ---------------------------------------------------------------- drawer / pane
    function isDrawerMode() { return !DESKTOP.matches; }
    function openDrawer() {
      document.body.classList.add('drawer-open');
      $('stage').inert = true;
      $('menuToggle').setAttribute('aria-expanded', 'true');
      const cur = document.querySelector('.lesson-item[aria-current="page"]') || document.querySelector('.lesson-item');
      if (cur) cur.focus();
    }
    function closeDrawer({ restoreFocus = true } = {}) {
      if (!document.body.classList.contains('drawer-open')) return;
      document.body.classList.remove('drawer-open');
      $('stage').inert = false;
      $('menuToggle').setAttribute('aria-expanded', 'false');
      if (restoreFocus) $('menuToggle').focus();
    }
    $('menuToggle').addEventListener('click', () => {
      if (isDrawerMode()) {
        document.body.classList.contains('drawer-open') ? closeDrawer() : openDrawer();
      } else {
        const collapsed = document.body.classList.toggle('sidebar-collapsed');
        $('menuToggle').setAttribute('aria-expanded', String(!collapsed));
      }
    });
    $('drawerClose').addEventListener('click', () => closeDrawer());
    $('backdrop').addEventListener('click', () => closeDrawer());
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
    function applyViewportMode() {
      closeDrawer({ restoreFocus: false });
      $('menuToggle').setAttribute('aria-expanded', String(isDrawerMode() ? false : !document.body.classList.contains('sidebar-collapsed')));
    }
    DESKTOP.addEventListener('change', applyViewportMode);

    // ---------------------------------------------------------------- toolbar
    $('btnReload').addEventListener('click', () => {
      try { frame.contentWindow.location.reload(); } catch (e) { frame.src = state.active.file; }
      $('stageLoading').hidden = false;
    });
    $('btnStandalone').addEventListener('click', () => { if (state.active) window.open(state.active.file, '_blank', 'noopener'); });
    $('btnPrint').addEventListener('click', () => {
      try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch (e) { postToFrame('tnq:print'); }
    });

    // ---------------------------------------------------------------- routing
    function routeFromHash() {
      const id = decodeURIComponent((location.hash.match(/^#\/(.+)$/) || [])[1] || '');
      const item = byId.get(id) || ALL[0];
      if (item !== state.active) loadLesson(item, { push: !byId.has(id) });
    }
    window.addEventListener('hashchange', routeFromHash);

    // ---------------------------------------------------------------- PWA: offline cache + install
    // Service workers need a secure context (https or localhost); file:// and plain-http LAN skip this.
    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => { /* offline cache unavailable; site still works online */ });
      });
    }
    let deferredInstall = null;
    window.addEventListener('beforeinstallprompt', (e) => {   // Android / desktop Chromium
      e.preventDefault();
      deferredInstall = e;
      $('installBtn').hidden = false;
    });
    $('installBtn').addEventListener('click', async () => {
      if (!deferredInstall) return;
      deferredInstall.prompt();
      await deferredInstall.userChoice.catch(() => { });
      deferredInstall = null;
      $('installBtn').hidden = true;
    });
    window.addEventListener('appinstalled', () => { $('installBtn').hidden = true; });
    // iOS Safari has no install prompt: show the one-line Share -> Add to Home Screen hint in the menu.
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIOS && !standalone && location.protocol.startsWith('http')) $('iosHint').hidden = false;
    // In the installed app a new window would leave the app: open standalone lessons in place instead.
    if (standalone) $('btnStandalone').hidden = true;

    buildSidebar();
    applyViewportMode();
    routeFromHash();
  </script>
</body>

</html>
