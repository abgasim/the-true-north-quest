<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mental Math Studio (All 4 Operations) - የአእምሮ ሂሳብ ልምምድ</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js for Web Audio Synthesis -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- Canvas Confetti for celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  
  <!-- Google Fonts: Handwritten math + Ethiopic typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Kalam:wght@700&family=Noto+Sans+Ethiopic:wght@400;600;700;800;900&family=Patrick+Hand&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans Ethiopic', 'Nunito', sans-serif;
      transition: background-color 0.3s ease;
    }
    .math-hand {
      font-family: 'Patrick Hand', 'Caveat', 'Kalam', 'Noto Sans Ethiopic', cursive;
    }
    .font-num {
      font-family: 'Fredoka', 'Noto Sans Ethiopic', sans-serif;
    }

    /* Notebook lined paper pattern with vertical red margin line */
    .notebook-paper {
      background-color: #fffdf8;
      background-image: 
        linear-gradient(90deg, transparent calc(50% - 1.5px), #f87171 50%, transparent calc(50% + 1.5px)),
        linear-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 100% 100%, 100% 3.25rem;
      background-position: 0 0, 0 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35);
    }

    /* Spiral binding holes at the top */
    .spiral-hole {
      width: 14px;
      height: 14px;
      background-color: #1e293b;
      border-radius: 50%;
      box-shadow: inset 1px 2px 3px rgba(0, 0, 0, 0.7), 0 1px 1px rgba(255, 255, 255, 0.8);
      position: relative;
    }
    .spiral-hole::after {
      content: '';
      position: absolute;
      top: -9px;
      left: 3px;
      width: 8px;
      height: 14px;
      border: 2.5px solid #94a3b8;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
    }

    /* Bubble Pop Animations */
    @keyframes carryPop {
      0% { transform: scale(0) translateY(14px); opacity: 0; }
      70% { transform: scale(1.25) translateY(-4px); }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .bubble-enter {
      animation: carryPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* SVG Linking Arc draw animation */
    @keyframes drawArcLine {
      from { stroke-dashoffset: 600; }
      to { stroke-dashoffset: 0; }
    }
    .arc-animate {
      stroke-dasharray: 600;
      stroke-dashoffset: 0;
      animation: drawArcLine 0.65s ease-out forwards;
    }

    /* Pulse animation for breaking numbers */
    @keyframes splitPulse {
      0% { transform: scale(0.85); opacity: 0; }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    .split-animate {
      animation: splitPulse 0.45s ease-out forwards;
    }

    .glow-digit {
      filter: drop-shadow(0 0 10px currentColor);
      transform: scale(1.12);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center select-none overflow-x-hidden p-2 sm:p-5">

  <main class="w-full max-w-4xl relative">

      <div class="spiral-hole"></div><div class="spiral-hole"></div><div class="spiral-hole"></div><div class="spiral-hole"></div>

        <!-- Equation Container -->

    function drawPlaceArc(elem1Id, elem2Id, colorHex, arcDepth = 55, reverse = false) {
      const elem1 = document.getElementById(elem1Id);
      const elem2 = document.getElementById(elem2Id);
      const workspace = document.getElementById('mathWorkspace');
      if (!elem1 || !elem2 || !workspace) return;

      const rect1 = elem1.getBoundingClientRect();
      const rect2 = elem2.getBoundingClientRect();
      const parentRect = workspace.getBoundingClientRect();

      const x1 = rect1.left + rect1.width / 2 - parentRect.left;
      const y1 = reverse ? (rect1.top - parentRect.top + 6) : (rect1.bottom - parentRect.top - 6);
      const x2 = rect2.left + rect2.width / 2 - parentRect.left;
      const y2 = reverse ? (rect2.top - parentRect.top + 6) : (rect2.bottom - parentRect.top - 6);

      const midX = (x1 + x2) / 2;
      const controlY = reverse ? (Math.min(y1, y2) - arcDepth) : (Math.max(y1, y2) + arcDepth);

      const pathData = `M ${x1},${y1} Q ${midX},${controlY} ${x2},${y2}`;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", pathData);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", colorHex);
      path.setAttribute("stroke-width", "3.5");
      path.setAttribute("stroke-linecap", "round");
      path.classList.add("arc-animate");

      const dot1 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot1.setAttribute("cx", x1); dot1.setAttribute("cy", y1); dot1.setAttribute("r", "4"); dot1.setAttribute("fill", colorHex);
      const dot2 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot2.setAttribute("cx", x2); dot2.setAttribute("cy", y2); dot2.setAttribute("r", "4"); dot2.setAttribute("fill", colorHex);

      arcSvg.appendChild(path);
      arcSvg.appendChild(dot1);
      arcSvg.appendChild(dot2);
    }

    function clearArcs() {
      arcSvg.innerHTML = '';
    }

    function getAddDecomposition(n1, n2) {
      const o1 = n1 % 10, t1 = Math.floor((n1 % 100) / 10), h1 = Math.floor(n1 / 100);
      const o2 = n2 % 10, t2 = Math.floor((n2 % 100) / 10), h2 = Math.floor(n2 / 100);
      const onesSumRaw = o1 + o2, carryToTens = onesSumRaw >= 10 ? 1 : 0, onesDigitFinal = onesSumRaw % 10;
      const tensSumRaw = t1 + t2 + carryToTens, carryToHundreds = tensSumRaw >= 10 ? 1 : 0, tensDigitFinal = tensSumRaw % 10;
      const hundredsSumRaw = h1 + h2 + carryToHundreds;
      return { o1, t1, h1, o2, t2, h2, onesSumRaw, carryToTens, onesDigitFinal, tensSumRaw, carryToHundreds, tensDigitFinal, hundredsSumRaw, total: n1 + n2 };
    }

    function getSubDecomposition(n1, n2) {
      const maxVal = Math.max(n1, n2);
      const minVal = Math.min(n1, n2);
      const o1 = maxVal % 10, t1 = Math.floor((maxVal % 100) / 10), h1 = Math.floor(maxVal / 100);
      const o2 = minVal % 10, t2 = Math.floor((minVal % 100) / 10), h2 = Math.floor(minVal / 100);

      const borrowFromTens = o1 < o2 ? 1 : 0;
      const effectiveO1 = borrowFromTens ? o1 + 10 : o1;
      const onesDiff = effectiveO1 - o2;

      const adjustedT1 = t1 - borrowFromTens;
      const borrowFromHundreds = adjustedT1 < t2 ? 1 : 0;
      const effectiveT1 = borrowFromHundreds ? adjustedT1 + 10 : adjustedT1;
      const tensDiff = effectiveT1 - t2;

      const adjustedH1 = h1 - borrowFromHundreds;
      const hundredsDiff = adjustedH1 - h2;

      return {
        maxVal, minVal, o1, t1, h1, o2, t2, h2,
        borrowFromTens, effectiveO1, onesDiff,
        adjustedT1, borrowFromHundreds, effectiveT1, tensDiff,
        adjustedH1, hundredsDiff,
        total: maxVal - minVal
      };
    }

    function getMulDecomposition(n1, n2, userA1, userA2) {
      let a1 = userA1, a2 = userA2;
      if (!a1 || !a2 || a1 + a2 !== n2) {
        if (n2 >= 10) { a1 = 10; a2 = n2 - 10; }
        else if (n2 >= 6) { a1 = 5; a2 = n2 - 5; }
        else { a1 = Math.floor(n2 / 2); a2 = n2 - a1; }
      }
      return { n1, n2, a1, a2, p1: n1 * a1, p2: n1 * a2, total: n1 * n2 };
    }

    function getDivDecomposition(n1, n2, userC1, userC2) {
      let c1 = userC1, c2 = userC2;
      if (!c1 || !c2 || c1 + c2 !== n1 || c1 % n2 !== 0 || c2 % n2 !== 0) {
        const roundTenMultiple = n2 * 10;
        if (n1 >= roundTenMultiple && (n1 - roundTenMultiple) % n2 === 0) {
          c1 = roundTenMultiple;
          c2 = n1 - roundTenMultiple;
        } else {
          const half = Math.floor(n1 / (2 * n2)) * n2;
          c1 = half > 0 ? half : n2;
          c2 = n1 - c1;
        }
      }
      return { n1, n2, c1, c2, q1: Math.floor(c1 / n2), q2: Math.floor(c2 / n2), total: Math.floor(n1 / n2) };
    }
  </script>

          <div class="flex items-center gap-1.5 text-blue-400"><span class="w-3.5 h-3.5 rounded-full bg-blue-500"></span><span>${t.subLegends.ones}</span></div>
          <div class="flex items-center gap-1.5 text-rose-400"><span class="w-4 h-4 rounded-full border border-rose-400 bg-rose-500/20 flex items-center justify-center text-[10px] text-rose-300 font-black">⊝</span><span>${t.subLegends.borrow}</span></div>
        `;
        customOpSymbol.textContent = '−';
      } else if (currentOp === 'mul') {
        strategyLegend.innerHTML = `
          <div class="flex items-center gap-1.5 text-blue-400"><span class="w-3.5 h-3.5 rounded-full bg-blue-500"></span><span>${t.mulLegends.factor1}</span></div>
          <div class="flex items-center gap-1.5 text-orange-400"><span class="w-3.5 h-3.5 rounded-full bg-orange-500"></span><span>${t.mulLegends.anchor1}</span></div>
          <div class="flex items-center gap-1.5 text-purple-400"><span class="w-3.5 h-3.5 rounded-full bg-purple-500"></span><span>${t.mulLegends.anchor2}</span></div>
        `;
        customOpSymbol.textContent = '×';
      } else if (currentOp === 'div') {
        strategyLegend.innerHTML = `
          <div class="flex items-center gap-1.5 text-rose-400"><span class="w-3.5 h-3.5 rounded-full bg-rose-500"></span><span>${t.divLegends.dividend}</span></div>
          <div class="flex items-center gap-1.5 text-blue-400"><span class="w-3.5 h-3.5 rounded-full bg-blue-500"></span><span>${t.divLegends.divisor}</span></div>
          <div class="flex items-center gap-1.5 text-emerald-400"><span class="w-3.5 h-3.5 rounded-full bg-emerald-500"></span><span>${t.divLegends.chunk1}</span></div>
          <div class="flex items-center gap-1.5 text-amber-400"><span class="w-3.5 h-3.5 rounded-full bg-amber-500"></span><span>${t.divLegends.chunk2}</span></div>
        `;
        customOpSymbol.textContent = '÷';
      }
    }

    function initCurrentOperation() {
      renderPresetsAndLegend();
      if (currentOp === 'add') renderAdditionWorkspace();
      else if (currentOp === 'sub') renderSubtractionWorkspace();
      else if (currentOp === 'mul') renderMultiplicationWorkspace();
      else if (currentOp === 'div') renderDivisionWorkspace();
    }

    function applyLanguageStrings() {
      const t = translations[currentLang];
      appTitle.childNodes[0].nodeValue = t.appTitle + " ";
      appSubtitle.textContent = t.appSubtitle;
      notebookTag.textContent = t.notebookTag;
      langBtnText.textContent = t.langBtn;
      modeGuidedText.textContent = t.modeGuided;
      modeQuizText.textContent = t.modeQuiz;
      fsText.textContent = document.fullscreenElement ? t.fsExitText : t.fsText;
      customBtnText.textContent = t.customBtn;
      randomBtnText.textContent = t.randomBtn;
      applyCustomText.textContent = t.applyCustom;
      sumHeaderLabel.textContent = t.sumHeader;
      resetBtnText.textContent = t.resetBtn;
      readAloudText.textContent = t.readAloud;
      shortcutHint.textContent = t.shortcutHint;

      opTabAdd.querySelector('.tab-label').textContent = t.tabAdd;
      opTabSub.querySelector('.tab-label').textContent = t.tabSub;
      opTabMul.querySelector('.tab-label').textContent = t.tabMul;
      opTabDiv.querySelector('.tab-label').textContent = t.tabDiv;

      initCurrentOperation();
    }

    function setOperation(op) {
      currentOp = op;
      currentStep = 0;
      playAudio('chime');

      [opTabAdd, opTabSub, opTabMul, opTabDiv].forEach(tab => {
        tab.className = "op-tab py-2.5 px-2 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition-all bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white";
      });

      if (op === 'add') opTabAdd.className = "op-tab py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm flex items-center justify-center gap-1.5 transition-all bg-emerald-600 text-white shadow-md shadow-emerald-900/30";
      else if (op === 'sub') opTabSub.className = "op-tab py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm flex items-center justify-center gap-1.5 transition-all bg-rose-600 text-white shadow-md shadow-rose-900/30";
      else if (op === 'mul') opTabMul.className = "op-tab py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm flex items-center justify-center gap-1.5 transition-all bg-orange-600 text-white shadow-md shadow-orange-900/30";
      else if (op === 'div') opTabDiv.className = "op-tab py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm flex items-center justify-center gap-1.5 transition-all bg-indigo-600 text-white shadow-md shadow-indigo-900/30";

      initCurrentOperation();
    }

    opTabAdd.addEventListener('click', () => setOperation('add'));
    opTabSub.addEventListener('click', () => setOperation('sub'));
    opTabMul.addEventListener('click', () => setOperation('mul'));
    opTabDiv.addEventListener('click', () => setOperation('div'));

    langToggleBtn.addEventListener('click', () => {
      currentLang = currentLang === 'en' ? 'am' : 'en';
      playAudio('chime');
      applyLanguageStrings();
    });

    modeGuidedBtn.addEventListener('click', () => {
      currentMode = 'guided';
      modeGuidedBtn.className = "px-2.5 sm:px-3 py-1.5 rounded-lg bg-emerald-600 text-white transition shadow";
      modeQuizBtn.className = "px-2.5 sm:px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition";
      currentStep = 0;
      initCurrentOperation();
    });

    modeQuizBtn.addEventListener('click', () => {
      currentMode = 'quiz';
      modeQuizBtn.className = "px-2.5 sm:px-3 py-1.5 rounded-lg bg-emerald-600 text-white transition shadow";
      modeGuidedBtn.className = "px-2.5 sm:px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition";
      currentStep = 0;
      initCurrentOperation();
    });

    stepNextBtn.addEventListener('click', () => {
      if (currentMode === 'guided') {
        const maxSteps = (currentOp === 'add' || currentOp === 'sub') ? 3 : 4;
        currentStep = currentStep < maxSteps ? currentStep + 1 : 0;
        initCurrentOperation();
      } else {
        generateRandomProblem();
      }
    });

    stepResetBtn.addEventListener('click', () => {
      currentStep = 0;
      initCurrentOperation();
    });

    function generateRandomProblem() {
      playAudio('chime');
      currentStep = 0;
      if (currentOp === 'add') {
        state.add.n1 = Math.floor(Math.random() * 800) + 120;
        state.add.n2 = Math.floor(Math.random() * 800) + 120;
      } else if (currentOp === 'sub') {
        const val1 = Math.floor(Math.random() * 800) + 120;
        const val2 = Math.floor(Math.random() * 800) + 120;
        state.sub.n1 = Math.max(val1, val2);
        state.sub.n2 = Math.min(val1, val2);
      } else if (currentOp === 'mul') {
        const factors = [6, 7, 8, 9, 12, 14];
        state.mul.n1 = factors[Math.floor(Math.random() * factors.length)];
        state.mul.n2 = [6, 7, 8, 9, 12][Math.floor(Math.random() * 5)];
        state.mul.a1 = null; state.mul.a2 = null;
      } else if (currentOp === 'div') {
        const divisors = [4, 5, 6, 7, 8];
        const d = divisors[Math.floor(Math.random() * divisors.length)];
        const mult = Math.floor(Math.random() * 18) + 11;
        state.div.n2 = d;
        state.div.n1 = d * mult;
        state.div.c1 = null; state.div.c2 = null;
      }
      initCurrentOperation();
    }
    randomBtn.addEventListener('click', generateRandomProblem);

    customToggleBtn.addEventListener('click', () => {
      customInputsBar.classList.toggle('hidden');
    });

    applyCustomBtn.addEventListener('click', () => {
      const v1 = parseInt(customInput1.value) || 8;
      const v2 = parseInt(customInput2.value) || 7;
      currentStep = 0;
      if (currentOp === 'add') {
        state.add.n1 = v1; state.add.n2 = v2;
      } else if (currentOp === 'sub') {
        state.sub.n1 = Math.max(v1, v2);
        state.sub.n2 = Math.min(v1, v2);
      } else if (currentOp === 'mul') {
        state.mul.n1 = v1; state.mul.n2 = v2;
        state.mul.a1 = null; state.mul.a2 = null;
      } else if (currentOp === 'div') {
        state.div.n1 = Math.max(v1, v2);
        state.div.n2 = Math.min(v1, v2) || 1;
        state.div.c1 = null; state.div.c2 = null;
      }
      customInputsBar.classList.add('hidden');
      initCurrentOperation();
    });

    audioBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      audioIcon.textContent = soundEnabled ? '🔊' : '🔇';
      audioBtn.classList.toggle('opacity-50', !soundEnabled);
      if (!soundEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    });

    function toggleFullScreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    }
    fsBtn.addEventListener('click', toggleFullScreen);

    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      const t = translations[currentLang];
      fsText.textContent = isFs ? t.fsExitText : t.fsText;
      setTimeout(initCurrentOperation, 150);
    });

    readAloudBtn.addEventListener('click', () => {
      let text = '';
      if (currentOp === 'add') {
        const d = getAddDecomposition(state.add.n1, state.add.n2);
        text = currentLang === 'am' 
          ? `${state.add.n1} ሲደመር ${state.add.n2}። አንድነቶች ${d.onesSumRaw}፣ አሥሮች ${d.tensSumRaw}፣ መቶዎች ${d.hundredsSumRaw}። አጠቃላይ ድምሩ ${d.total} ነው።`
          : `${state.add.n1} plus ${state.add.n2}. Ones sum is ${d.onesSumRaw}, tens sum is ${d.tensSumRaw}, hundreds sum is ${d.hundredsSumRaw}. Total answer is ${d.total}.`;
      } else if (currentOp === 'sub') {
        const d = getSubDecomposition(state.sub.n1, state.sub.n2);
        text = currentLang === 'am'
          ? `${state.sub.n1} ሲቀነስ ${state.sub.n2}። አንድነቶች ${d.onesDiff}፣ አሥሮች ${d.tensDiff}፣ መቶዎች ${d.hundredsDiff}። የቀረው ልዩነት ${d.total} ነው።`
          : `${state.sub.n1} minus ${state.sub.n2}. Ones difference is ${d.onesDiff}, tens difference is ${d.tensDiff}, hundreds difference is ${d.hundredsDiff}. Remaining difference is ${d.total}.`;
      } else if (currentOp === 'mul') {
        const d = getMulDecomposition(state.mul.n1, state.mul.n2, state.mul.a1, state.mul.a2);
        text = currentLang === 'am'
          ? `${d.n1} ሲባዛ በ ${d.n2}። ${d.n2} ን ወደ ${d.a1} እና ${d.a2} እንበትናለን። ብዜቶች ${d.p1} እና ${d.p2}። አጠቃላይ ውጤት ${d.total} ነው።`
          : `${d.n1} times ${d.n2}. Decompose ${d.n2} into ${d.a1} and ${d.a2}. Partial products are ${d.p1} and ${d.p2}. Total is ${d.total}.`;
      } else if (currentOp === 'div') {
        const d = getDivDecomposition(state.div.n1, state.div.n2, state.div.c1, state.div.c2);
        text = currentLang === 'am'
          ? `${d.n1} ሲካፈል ለ ${d.n2}። ${d.n1} ን ወደ ${d.c1} እና ${d.c2} እንከፍለዋለን። ድርሻዎች ${d.q1} እና ${d.q2} ሲሆኑ አጠቃላይ ድርሻ ${d.total} ነው።`
          : `${d.n1} divided by ${d.n2}. Chunk ${d.n1} into ${d.c1} and ${d.c2}. Partial quotients are ${d.q1} and ${d.q2}. Final quotient is ${d.total}.`;
      }
      speakText(text);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        toggleFullScreen();
      } else if (e.key === ' ' || e.key === 'Enter') {
        if (currentMode === 'guided') {
          const maxSteps = (currentOp === 'add' || currentOp === 'sub') ? 3 : 4;
          currentStep = currentStep < maxSteps ? currentStep + 1 : 0;
          initCurrentOperation();
        }
      } else if (e.key === 'r' || e.key === 'R') {
        generateRandomProblem();
      }
    });

    window.addEventListener('resize', () => {
      initCurrentOperation();
    });

    window.onload = function() {
      applyLanguageStrings();
    };
  </script>
</body>
</html>
