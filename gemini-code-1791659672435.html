  <style>
    body {
      font-family: 'Fredoka', 'Noto Sans Ethiopic', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31102f 100%);
      color: #f8fafc;
      min-height: 100vh;
      touch-action: manipulation;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card-flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 1.5rem;
    }
    .card-back {
      transform: rotateY(180deg);
    }
    .touch-target {
      min-height: 48px;
      min-width: 48px;
    }
    /* Hide scrollbars for pill bars */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.8); }
    }
    .glow-maple {
      animation: pulseGlow 3s infinite ease-in-out;
    }
  </style>

        restartMatch: "እንደገና ጀምር ↺",
        matchPairsRemaining: "የቀሩት ጥንዶች፡",
        footerText: "ካናዳ 10 ክፍላተ-ሀገራትና 3 ግዛቶች አሏት • ፌዴራላዊ ዋና ከተማዋ ኦታዋ ናት",
        territoryBadge: "ግዛት (Territory)",
        provinceBadge: "ክፍለ-ሀገር (Province)"
      }
    };

    // Tone.js Sound Synthesizer
    function playTone(type) {
      if (!audioOn) return;
      try {
        if (!synth) synth = new Tone.PolySynth(Tone.Synth).toDestination();
        if (Tone.context.state !== 'running') Tone.start();
        if (type === 'flip') {
          synth.triggerAttackRelease(["C4"], "32n");
        } else if (type === 'correct') {
          synth.triggerAttackRelease(["C5", "E5", "G5"], "16n");
        } else if (type === 'wrong') {
          synth.triggerAttackRelease(["F3", "Db3"], "16n");
        } else if (type === 'win') {
          synth.triggerAttackRelease(["C5", "G5", "C6"], "8n");
        }
      } catch (e) {
        console.warn("Audio Context init pending user interaction.");
      }
    }

    function toggleAudio() {
      audioOn = !audioOn;
      document.getElementById('audioIcon').textContent = audioOn ? '🔊' : '🔇';
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function toggleLang() {
      currentLang = currentLang === 'en' ? 'am' : 'en';
      document.getElementById('langBtnText').textContent = i18n[currentLang].langBtn;
      document.getElementById('txtTitle').textContent = i18n[currentLang].title;
      document.getElementById('txtSubtitle').textContent = i18n[currentLang].subtitle;
      document.getElementById('lblScore').textContent = i18n[currentLang].score;
      document.getElementById('lblStreak').textContent = i18n[currentLang].streak;
      document.getElementById('tabLbl_flashcard').textContent = i18n[currentLang].tabFlashcard;
      document.getElementById('tabLbl_quiz').textContent = i18n[currentLang].tabQuiz;
      document.getElementById('tabLbl_match').textContent = i18n[currentLang].tabMatch;
      document.getElementById('tabLbl_grid').textContent = i18n[currentLang].tabGrid;
      document.getElementById('txtFooter').textContent = i18n[currentLang].footerText;

      renderCurrentMode();
    }

    function switchGameMode(mode) {
      currentMode = mode;
      const tabs = ['flashcard', 'quiz', 'match', 'grid'];
      tabs.forEach(t => {
        const btn = document.getElementById('tab_' + t);
        if (t === mode) {
          btn.className = "flex-1 min-w-[100px] touch-target py-2.5 px-3 rounded-xl text-xs sm:text-sm font-black transition text-white bg-red-600 shadow-md";
        } else {
          btn.className = "flex-1 min-w-[100px] touch-target py-2.5 px-3 rounded-xl text-xs sm:text-sm font-black transition text-slate-400 hover:text-white";
        }
      });
      renderCurrentMode();
    }

    function renderCurrentMode() {
      const arena = document.getElementById('gameArena');
      arena.innerHTML = '';
      if (currentMode === 'flashcard') renderFlashcard(arena);
      else if (currentMode === 'quiz') renderQuiz(arena);
      else if (currentMode === 'match') initMatchGame(arena);
      else if (currentMode === 'grid') renderGrid(arena);
    }

    // ==========================================
    // 1. 3D INTERACTIVE FLASHCARD MODE
    // ==========================================
    function renderFlashcard(container) {
      const item = canadaData[cardIndex];
      const isProv = item.type === 'province';
      const typeBadge = isProv ? i18n[currentLang].provinceBadge : i18n[currentLang].territoryBadge;

      const name = currentLang === 'en' ? item.nameEn : item.nameAm;
      const capital = currentLang === 'en' ? item.capitalEn : item.capitalAm;
      const largest = currentLang === 'en' ? item.largestEn : item.largestAm;
      const fact = currentLang === 'en' ? item.factEn : item.factAm;

      container.innerHTML = `
        <div class="w-full max-w-md h-[400px] perspective-1000 select-none cursor-pointer" onclick="flipCard()">
          <div id="flashCardElement" class="card-inner ${isFlipped ? 'card-flipped' : ''} shadow-2xl">
            
            <!-- FRONT -->
            <div class="card-front bg-gradient-to-br ${item.color} p-6 sm:p-8 flex flex-col justify-between border-2 border-white/20 text-white shadow-xl">
              <div class="flex items-center justify-between">
                <span class="text-xs uppercase font-extrabold px-3 py-1 bg-black/30 backdrop-blur-md rounded-full border border-white/20">
                  ${typeBadge} (${cardIndex + 1}/13)
                </span>
                <span class="text-3xl">${item.icon}</span>
              </div>

              <div class="text-center my-auto">
                <div class="text-5xl mb-3 drop-shadow-md">${item.flag}</div>
                <h2 class="text-3xl sm:text-4xl font-black tracking-tight drop-shadow-md">${name}</h2>
                <p class="text-xs text-white/80 mt-3 font-semibold">${i18n[currentLang].flipCardPrompt}</p>
              </div>

              <div class="flex justify-between items-center text-xs opacity-80 font-bold border-t border-white/20 pt-3">
                <span>🍁 Canada Geography</span>
                <span>Tap to flip 🔄</span>
              </div>
            </div>

            <!-- BACK -->
            <div class="card-back bg-slate-900 border-2 border-red-500/50 p-6 sm:p-8 flex flex-col justify-between text-white shadow-xl">
              <div>
                <div class="flex items-center justify-between border-b border-slate-700/80 pb-3 mb-4">
                  <span class="text-xs uppercase font-bold text-red-400">${name}</span>
                  <span class="text-xs bg-red-950 text-red-300 border border-red-700 px-2 py-0.5 rounded-full font-bold">Answer</span>
                </div>

                <div class="space-y-4">
                  <div>
                    <div class="text-xs uppercase font-extrabold text-slate-400">${i18n[currentLang].capitalLbl}</div>
                    <div class="text-3xl sm:text-4xl font-black text-amber-400 tracking-tight mt-1 flex items-center gap-2">
                      🏛️ <span>${capital}</span>
                    </div>
                  </div>

                  ${largest ? `
                  <div>
                    <div class="text-xs uppercase font-extrabold text-slate-400">${i18n[currentLang].largestLbl}</div>
                    <div class="text-lg font-bold text-slate-200 mt-0.5">${largest}</div>
                  </div>` : ''}

                  <div class="p-3 bg-slate-800/80 rounded-xl border border-slate-700 text-xs text-slate-300 leading-relaxed">
                    <strong class="text-amber-400 font-bold block mb-1">💡 ${i18n[currentLang].didYouKnow}</strong>
                    ${fact}
                  </div>
                </div>
              </div>

              <div class="text-center text-xs text-slate-500 font-semibold pt-2">
                Tap to flip back 🔄
              </div>
            </div>

          </div>
        </div>

        <!-- Controls -->
        <div class="w-full max-w-md flex items-center justify-between gap-2 mt-5">
          <button onclick="prevCard()" class="touch-target px-4 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs sm:text-sm font-bold text-white transition active:scale-95 shadow">
            ${i18n[currentLang].prevCard}
          </button>
          <button onclick="shuffleCard()" class="touch-target px-4 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs sm:text-sm font-bold text-amber-400 transition active:scale-95 shadow">
            ${i18n[currentLang].randomCard}
          </button>
          <button onclick="nextCard()" class="touch-target px-5 py-2.5 bg-red-600 hover:bg-red-500 rounded-xl text-xs sm:text-sm font-bold text-white shadow-lg transition active:scale-95">
            ${i18n[currentLang].nextCard}
          </button>
        </div>
      `;
    }

    function flipCard() {
      isFlipped = !isFlipped;
      playTone('flip');
      const el = document.getElementById('flashCardElement');
      if (el) el.classList.toggle('card-flipped', isFlipped);
    }

    function nextCard() {
      isFlipped = false;
      cardIndex = (cardIndex + 1) % canadaData.length;
      renderFlashcard(document.getElementById('gameArena'));
    }

    function prevCard() {
      isFlipped = false;
      cardIndex = (cardIndex - 1 + canadaData.length) % canadaData.length;
      renderFlashcard(document.getElementById('gameArena'));
    }

    function shuffleCard() {
      isFlipped = false;
      cardIndex = Math.floor(Math.random() * canadaData.length);
      renderFlashcard(document.getElementById('gameArena'));
    }

    // ==========================================
    // 2. SPEED MULTIPLE-CHOICE QUIZ MODE
    // ==========================================
    let currentQuizTarget = null;
    let quizAnswered = false;

    function renderQuiz(container) {
      quizAnswered = false;
      currentQuizTarget = canadaData[Math.floor(Math.random() * canadaData.length)];
      
      const targetName = currentLang === 'en' ? currentQuizTarget.nameEn : currentQuizTarget.nameAm;
      const correctCapital = currentLang === 'en' ? currentQuizTarget.capitalEn : currentQuizTarget.capitalAm;

      // Pick 3 random distractors
      const distractors = canadaData
        .filter(d => d.id !== currentQuizTarget.id)
        .sort(() => 0.5 - Math.random())
        .slice(0, 3)
        .map(d => currentLang === 'en' ? d.capitalEn : d.capitalAm);

      const options = [correctCapital, ...distractors].sort(() => 0.5 - Math.random());

      container.innerHTML = `
        <div class="w-full max-w-lg bg-slate-900/90 border border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center text-center">
          
          <div class="text-4xl mb-2">${currentQuizTarget.icon}</div>
          <span class="text-xs uppercase font-extrabold tracking-wider text-red-400 bg-red-950/60 border border-red-800/80 px-3 py-1 rounded-full mb-3">
            ${currentQuizTarget.type === 'province' ? i18n[currentLang].provinceBadge : i18n[currentLang].territoryBadge}
          </span>

          <h2 class="text-sm sm:text-base font-semibold text-slate-300">
            ${i18n[currentLang].quizQuestion}
          </h2>
          <div class="text-3xl sm:text-4xl font-black text-white mt-1 mb-6 tracking-tight">
            ${targetName}
          </div>

          <div class="w-full grid grid-cols-1 sm:grid-cols-2 gap-3" id="quizOptionsGrid">
            ${options.map(opt => `
              <button onclick="handleQuizAnswer('${opt}', '${correctCapital}')" class="touch-target py-3.5 px-4 bg-slate-800 hover:bg-slate-700/80 border-2 border-slate-600 hover:border-amber-400 rounded-2xl text-base font-bold text-white transition active:scale-95 shadow">
                ${opt}
              </button>
            `).join('')}
          </div>

          <!-- Feedback Box -->
          <div id="quizFeedback" class="w-full mt-5 p-3 rounded-2xl hidden text-sm font-bold flex items-center justify-between">
            <span id="quizFeedbackText"></span>
            <button onclick="renderQuiz(document.getElementById('gameArena'))" class="px-4 py-2 bg-white text-slate-900 rounded-xl text-xs font-black shadow hover:bg-slate-100 transition active:scale-95">
              Next ➔
            </button>
          </div>

        </div>
      `;
    }

    function handleQuizAnswer(selected, correct) {
      if (quizAnswered) return;
      quizAnswered = true;

      const fb = document.getElementById('quizFeedback');
      const fbTxt = document.getElementById('quizFeedbackText');
      fb.classList.remove('hidden', 'bg-emerald-900/80', 'text-emerald-200', 'border-emerald-600', 'bg-rose-900/80', 'text-rose-200', 'border-rose-600');

      if (selected === correct) {
        score += 10;
        streak += 1;
        playTone('correct');
        confetti({ particleCount: 35, spread: 60, origin: { y: 0.7 } });
        fb.classList.add('bg-emerald-900/80', 'text-emerald-200', 'border', 'border-emerald-600');
        fbTxt.textContent = `🎉 Correct! ${selected} is the capital!`;
      } else {
        streak = 0;
        playTone('wrong');
        fb.classList.add('bg-rose-900/80', 'text-rose-200', 'border', 'border-rose-600');
        fbTxt.textContent = `❌ Not quite! The capital is ${correct}.`;
      }

      document.getElementById('scoreVal').textContent = score;
      document.getElementById('streakVal').textContent = streak;
    }

    // ==========================================
    // 3. MATCHING PAIR GAME (MEMORY & AGILITY)
    // ==========================================
    function initMatchGame(container) {
      matchSelected = [];
      matchMatchedCount = 0;

      // Pick 6 random provinces/territories for a 12-card board
      const sample = canadaData.sort(() => 0.5 - Math.random()).slice(0, 6);
      matchDeck = [];

      sample.forEach(item => {
        // Province card
        matchDeck.push({
          id: item.id,
          type: 'name',
          label: currentLang === 'en' ? item.nameEn : item.nameAm,
          icon: item.icon,
          matched: false
        });
        // Capital card
        matchDeck.push({
          id: item.id,
          type: 'capital',
          label: currentLang === 'en' ? item.capitalEn : item.capitalAm,
          icon: '🏛️',
          matched: false
        });
      });

      // Shuffle deck
      matchDeck.sort(() => 0.5 - Math.random());
      renderMatchBoard(container);
    }

    function renderMatchBoard(container) {
      container.innerHTML = `
        <div class="w-full max-w-2xl flex flex-col items-center">
          
          <div class="w-full flex items-center justify-between text-xs font-bold text-slate-300 mb-3 px-2">
            <span>${i18n[currentLang].matchPairsRemaining} <strong id="matchRemainingCount" class="text-amber-400 font-mono text-sm">${6 - matchMatchedCount}</strong></span>
            <button onclick="initMatchGame(document.getElementById('gameArena'))" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-600 transition">
              ${i18n[currentLang].restartMatch}
            </button>
          </div>

          <div class="grid grid-cols-3 sm:grid-cols-4 gap-2.5 sm:gap-3 w-full" id="matchCardsGrid">
            ${matchDeck.map((card, idx) => `
              <button onclick="handleMatchCardClick(${idx})" id="mcard_${idx}" class="touch-target h-24 sm:h-28 p-2 rounded-2xl border-2 flex flex-col items-center justify-center text-center transition-all duration-200 active:scale-95 shadow-md ${
                card.matched 
                  ? 'bg-emerald-900/50 border-emerald-500 text-emerald-200 opacity-60 pointer-events-none' 
                  : 'bg-slate-800/90 hover:bg-slate-700 border-slate-600 text-white'
              }">
                <span class="text-xl sm:text-2xl mb-1">${card.icon}</span>
                <span class="text-xs sm:text-sm font-bold leading-tight">${card.label}</span>
              </button>
            `).join('')}
          </div>

          <div id="matchVictoryBanner" class="hidden mt-6 p-4 bg-emerald-950 border-2 border-emerald-500 rounded-2xl text-center">
            <div class="text-3xl mb-1">🏆</div>
            <div class="text-lg font-black text-emerald-300">Outstanding! All Pairs Matched!</div>
            <p class="text-xs text-emerald-400 mt-1">You scored +50 bonus points!</p>
          </div>

        </div>
      `;
    }

    function handleMatchCardClick(idx) {
      const card = matchDeck[idx];
      if (card.matched || matchSelected.includes(idx) || matchSelected.length >= 2) return;

      playTone('flip');
      matchSelected.push(idx);

      // Highlight selected
      const el = document.getElementById(`mcard_${idx}`);
      el.classList.remove('bg-slate-800/90', 'border-slate-600');
      el.classList.add('bg-amber-600', 'border-amber-300', 'scale-105');

      if (matchSelected.length === 2) {
        const [firstIdx, secondIdx] = matchSelected;
        const c1 = matchDeck[firstIdx];
        const c2 = matchDeck[secondIdx];

        if (c1.id === c2.id && c1.type !== c2.type) {
          // MATCH!
          c1.matched = true;
          c2.matched = true;
          matchMatchedCount++;
          score += 15;
          streak += 1;
          playTone('correct');

          setTimeout(() => {
            const el1 = document.getElementById(`mcard_${firstIdx}`);
            const el2 = document.getElementById(`mcard_${secondIdx}`);
            el1.className = "touch-target h-24 sm:h-28 p-2 rounded-2xl border-2 flex flex-col items-center justify-center text-center transition-all bg-emerald-900/50 border-emerald-500 text-emerald-200 opacity-60 pointer-events-none";
            el2.className = "touch-target h-24 sm:h-28 p-2 rounded-2xl border-2 flex flex-col items-center justify-center text-center transition-all bg-emerald-900/50 border-emerald-500 text-emerald-200 opacity-60 pointer-events-none";
            
            document.getElementById('matchRemainingCount').textContent = 6 - matchMatchedCount;
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('streakVal').textContent = streak;

            matchSelected = [];

            if (matchMatchedCount === 6) {
              score += 50;
              document.getElementById('scoreVal').textContent = score;
              playTone('win');
              confetti({ particleCount: 70, spread: 80, origin: { y: 0.6 } });
              document.getElementById('matchVictoryBanner').classList.remove('hidden');
            }
          }, 400);

        } else {
          // NO MATCH
          streak = 0;
          playTone('wrong');
          document.getElementById('streakVal').textContent = streak;

          setTimeout(() => {
            const el1 = document.getElementById(`mcard_${firstIdx}`);
            const el2 = document.getElementById(`mcard_${secondIdx}`);
            if (el1) {
              el1.className = "touch-target h-24 sm:h-28 p-2 rounded-2xl border-2 flex flex-col items-center justify-center text-center transition-all bg-slate-800/90 hover:bg-slate-700 border-slate-600 text-white";
            }
            if (el2) {
              el2.className = "touch-target h-24 sm:h-28 p-2 rounded-2xl border-2 flex flex-col items-center justify-center text-center transition-all bg-slate-800/90 hover:bg-slate-700 border-slate-600 text-white";
            }
            matchSelected = [];
          }, 800);
        }
      }
    }

    // ==========================================
    // 4. MAP DIRECTORY / REFERENCE GRID
    // ==========================================
    function renderGrid(container) {
      container.innerHTML = `
        <div class="w-full max-w-4xl grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
          ${canadaData.map((d, i) => {
            const name = currentLang === 'en' ? d.nameEn : d.nameAm;
            const cap = currentLang === 'en' ? d.capitalEn : d.capitalAm;
            const fact = currentLang === 'en' ? d.factEn : d.factAm;
            return `
              <div class="bg-slate-900/80 border border-slate-700/80 rounded-2xl p-4 flex flex-col justify-between shadow-md hover:border-slate-500 transition">
                <div>
                  <div class="flex items-center justify-between mb-2">
                    <span class="text-2xl">${d.icon}</span>
                    <span class="text-[10px] uppercase font-bold text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full border border-slate-700">
                      ${d.type === 'province' ? 'Province' : 'Territory'}
                    </span>
                  </div>
                  <h3 class="text-lg font-black text-white">${name}</h3>
                  <div class="mt-2 flex items-center gap-1.5 text-amber-400 font-extrabold text-sm">
                    <span>🏛️ Capital:</span> <span>${cap}</span>
                  </div>
                  <p class="text-xs text-slate-400 mt-2 leading-relaxed">
                    ${fact}
                  </p>
                </div>
                <button onclick="cardIndex = ${i}; switchGameMode('flashcard');" class="mt-4 w-full py-1.5 bg-slate-800 hover:bg-red-600 rounded-xl text-xs font-bold text-slate-200 hover:text-white transition">
                  Practice in Flashcard ➔
                </button>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // Keyboard shortcut F
    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') toggleFullScreen();
      if (currentMode === 'flashcard') {
        if (e.key === 'ArrowRight' || e.key === ' ') nextCard();
        if (e.key === 'ArrowLeft') prevCard();
        if (e.key === 'Enter') flipCard();
      }
    });

    // Initial render
    renderCurrentMode();
  </script>
</body>
</html>
