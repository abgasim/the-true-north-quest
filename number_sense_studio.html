      function enBelow100(n) {
        if (n < 20) return EN_ONES[n];
        return EN_TENS[Math.floor(n / 10)] + (n % 10 ? '-' + EN_ONES[n % 10] : '');
      }
      function enWords(n) {
        if (!Number.isInteger(n) || n < 0 || n > 9999) throw new RangeError('0..9999 only');

        if (n >= 1000) parts.push(EN_ONES[Math.floor(n / 1000)] + ' thousand');
        if (n % 1000 >= 100) parts.push(EN_ONES[Math.floor(n / 100) % 10] + ' hundred');

        const g = [];
        for (let i = 1; i < W; i++) { g.push(line([i, 0, H], [i, D, H]), line([i, D, 0], [i, D, H])); }

          poly([[W, 0, 0], [W, D, 0], [W, D, H], [W, 0, H]], k.right) +
          `<g stroke="${k.line}" stroke-width="0.45" stroke-opacity="0.7">${g.join('')}</g></svg>`;

        expTitle: "Expanded Form (Numbers)", expPrompt: "Fill in the blanks with the correct values:",
        expExp: (n, parts) => `${n} = ${parts.join(' + ')}` + (String(n).includes('0') ? ' (a zero digit adds nothing, so it is skipped)' : ''),
        cmpExp: (a, b, s) => `${a} ${s} ${b}: compare from the left; the first different digit decides.`,
        rndPrompt: "Round to the nearest thousand:",
        rndExp: (n, r) => `The hundreds digit of ${n} is ${Math.floor(n / 100) % 10}, so ${n} rounds ${r > n ? 'up' : 'down'} to ${r.toLocaleString('en-US')}.`,
        rndNotice: "⚠️ Note: 9 in the hundreds place rounds UP to 2000!",
        bonusBadge: "🌟 Bonus Challenge", bonusPrompt: "Round this number to the three requested places:",
        bonusTh: "1. To Nearest Thousand:", bonusH: "2. To Nearest Hundred:", bonusT: "3. To Nearest Ten:",
        bonusExp: (n, a, b, c) => `Thousand: ${n} → ${a}. Hundred: ${n} → ${b}. Ten: ${n} → ${c}.`,
        correct: "Spot on! That's correct!", incorrect: "Not quite! Look at the place value carefully."
      }
    };

    // =====================================================================
    // 3. QUESTION BANK (from the printed quiz) + RANDOM GENERATORS
    // =====================================================================
    const quizBank = {
      placeValue: [
        { num: 152, targetIndex: 1, options: ["5", "50", "500", "5000"] },
        { num: 5508, targetIndex: 1, options: ["50", "500", "5000", "5500"] },
        { num: 5391, targetIndex: 0, options: ["50", "500", "5000", "50000"] }
      ],
      numberWords: [
        { num: 46, contextEn: "Score: (46)" },
        { num: 112, contextEn: "House for Sale: (112 Broadway Street)" }
      ],
      mabBlocks: [{ thousands: 7, hundreds: 1, tens: 9, ones: 8 }],
      expanded: [{ num: 5183 }, { num: 309 }],
      comparison: [{ left: 4075, right: 4005 }, { left: 8612, right: 8611 }, { left: 3845, right: 3855 }],
      rounding: [{ num: 4268 }, { num: 1922, notice: true }, { num: 958 }, { num: 5177 }],
      bonus: [{ num: 7642 }]
    };
    const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
    const expandedParts = n => [...String(n)].map((d, i, a) => Number(d) * 10 ** (a.length - 1 - i)).filter(v => v > 0);
    const roundTo = (n, step) => Math.round(n / step) * step;   // .5 rounds up for positive n

    // =====================================================================
    // 4. STATE + UI
    // =====================================================================
    const CATS = ['placeValue', 'numberWords', 'mabBlocks', 'expanded', 'comparison', 'rounding', 'bonus'];
    let curCategory = 'placeValue', quizSource = 'original';
    let score = 0, streak = 0, correctCount = 0, attemptCount = 0;
    let audioOn = true, synth = null, activeQuestionIndex = 0, answered = false;
    let Q = null;   // the current question: { check(), exp(t) , ... }
    const $ = id => document.getElementById(id);
    const T = () => i18n.en;
    const shuffled = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    function playTone(type) {
      if (!audioOn) return;
      try {
        if (!synth) synth = new Tone.Synth().toDestination();
        if (Tone.context.state !== 'running') Tone.start();
        if (type === 'correct') { synth.triggerAttackRelease("C5", "16n", "+0"); synth.triggerAttackRelease("G5", "16n", "+0.1"); synth.triggerAttackRelease("C6", "8n", "+0.2"); }
        else { synth.triggerAttackRelease("E3", "8n", "+0"); synth.triggerAttackRelease("C3", "8n", "+0.15"); }
      } catch (e) { /* audio is optional */ }
    }
    function toggleAudio() { audioOn = !audioOn; $('audioIcon').textContent = audioOn ? '🔊' : '🔇'; $('btnAudio').setAttribute('aria-pressed', String(audioOn)); }
    function toggleFullScreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => { });
      else document.exitFullscreen?.();
    }
    document.addEventListener('fullscreenchange', () => {
      const fs = !!document.fullscreenElement;
      $('fsIcon').textContent = fs ? '↙' : '⛶';
      $('fsText').textContent = fs ? T().fsExit : T().fsText;
    });
    window.addEventListener('keydown', (e) => {
      const typing = e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
      if ((e.key === 'f' || e.key === 'F') && !typing) toggleFullScreen();
      if (e.key === 'Enter') {
        if (answered) nextQuestion();
        else if ($('btnSubmitAnswer')) $('btnSubmitAnswer').click();
      }
    });

    function applyStaticI18n() {
      const t = T();
      document.querySelectorAll('[data-i18n]').forEach(el => { const v = t[el.dataset.i18n]; if (typeof v === 'string') el.textContent = v; });
      document.querySelectorAll('[data-i18n-attr]').forEach(el => el.dataset.i18nAttr.split(',').forEach(p => { const [a, k] = p.split(':'); if (typeof t[k] === 'string') el.setAttribute(a, t[k]); }));
      $('fsText').textContent = document.fullscreenElement ? t.fsExit : t.fsText;
      $('currentCategoryTitle').textContent = t.categories[curCategory];
      $('teacherTip').textContent = t.tips[curCategory];
    }

    function styleTabs() {
      CATS.forEach(c => {
        const el = $('tab_' + c);
        const on = c === curCategory;
        el.className = 'cat-tab px-3 py-2 min-h-[40px] rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition ' +
          (on ? 'bg-amber-600 text-white shadow-sm' : (c === 'bonus' ? 'text-rose-700 hover:bg-rose-50' : 'text-slate-700 hover:bg-slate-100'));
        el.setAttribute('aria-pressed', String(on));
      });
      const src = (id, on) => { $(id).className = 'px-3 py-1.5 min-h-[36px] rounded-lg transition ' + (on ? 'bg-emerald-700 text-white shadow-sm' : 'bg-slate-200 text-slate-800 hover:bg-slate-300'); $(id).setAttribute('aria-pressed', String(on)); };
      src('btnSourceOriginal', quizSource === 'original');
      src('btnSourceRandom', quizSource === 'random');
    }
    function selectCategory(cat) { curCategory = cat; activeQuestionIndex = 0; styleTabs(); applyStaticI18n(); loadCurrentQuestion(); }
    function setQuizSource(src) { quizSource = src; activeQuestionIndex = 0; styleTabs(); loadCurrentQuestion(); }

    const pick = list => list[activeQuestionIndex % list.length];
    const submitBtn = (label) => `<button type="button" id="btnSubmitAnswer" onclick="submitAnswer()" class="px-6 py-2.5 min-h-[44px] bg-slate-900 text-white rounded-xl text-sm font-bold shadow hover:bg-slate-800 transition active:scale-95">${label}</button>`;
    const numInput = (id, w = 'w-36', aria = '') => `<input type="number" inputmode="numeric" id="${id}" ${aria ? `aria-label="${aria}"` : ''} class="${w} text-center px-3 py-2.5 text-2xl font-black bg-white border-2 border-slate-300 rounded-xl focus:border-amber-500" placeholder="?">`;
    const intVal = id => parseInt(($(id) || {}).value, 10);

    function loadCurrentQuestion() {
      answered = false;
      $('feedbackBanner').classList.add('hidden');
      const ws = $('quizWorkspace');
      ws.innerHTML = '';
      ({ placeValue: renderPlaceValueQ, numberWords: renderNumberWordsQ, mabBlocks: renderMabBlocksQ, expanded: renderExpandedQ, comparison: renderComparisonQ, rounding: renderRoundingQ, bonus: renderBonusQ })[curCategory](ws);
    }

    // ---- 1. Place value (exact-index highlight)
    function renderPlaceValueQ(ws) {
      const t = T();
      let numStr, idx, options;
      if (quizSource === 'original') { const s = pick(quizBank.placeValue); numStr = String(s.num); idx = s.targetIndex; options = s.options; }
      else {
        numStr = String(rnd(1000, 9999)); idx = rnd(0, 3);
        const d = Number(numStr[idx]) || 1;
        if (numStr[idx] === '0') numStr = numStr.slice(0, idx) + '1' + numStr.slice(idx + 1);
        options = shuffled([...new Set([d, d * 10, d * 100, d * 1000].map(String))]);
      }
      const digit = numStr[idx], val = String(TNQNumber.placeValueAt(numStr, idx));
      Q = { exp: () => T().pvExp(digit, T().places[numStr.length - 1 - idx], val) };
      ws.innerHTML = `
        <div class="mb-4">
          <span class="text-sm font-bold text-slate-600 uppercase">${t.question}</span>
          <div class="text-4xl sm:text-6xl font-black text-slate-900 mt-2 font-mono tracking-widest" id="pvNumber">${TNQNumber.highlightDigitByIndex(numStr, idx)}</div>
          <p class="text-slate-700 text-sm mt-3 font-semibold">${t.pvPrompt(digit)}</p>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full max-w-md mt-2">
          ${options.map(o => `<button type="button" class="opt-btn min-h-[48px] py-3 px-4 bg-slate-50 hover:bg-amber-100 hover:border-amber-400 border-2 border-slate-300 rounded-2xl text-xl font-black text-slate-800 transition active:scale-95 shadow-sm" data-opt="${o}">${o}</button>`).join('')}
        </div>`;
      ws.querySelectorAll('.opt-btn').forEach(b => b.addEventListener('click', () => showFeedback(b.dataset.opt === val, Q.exp())));
    }

    // ---- 2. Number words
    function renderNumberWordsQ(ws) {
      const t = T();
      const s = quizSource === 'original' ? pick(quizBank.numberWords) : { num: rnd(11, 9999), contextEn: '', contextAm: '' };
      Q = {
        check: () => TNQNumber.matchesWords($('wordInput').value, s.num),
        exp: () => T().nwExp(s.num) + (s.num === 46 ? T().nwSpellNote : '')
      };
      ws.innerHTML = `
        <div class="w-full max-w-md bg-amber-50/60 border-2 border-dashed border-amber-300 rounded-3xl p-4 sm:p-6 mb-4">
          <div class="text-xs font-bold text-amber-800 uppercase">${s.contextEn}</div>
          <div class="text-5xl sm:text-6xl font-black text-slate-900 my-3 font-mono">(${s.num})</div>
          <label for="wordInput" class="block text-xs text-slate-600 mb-3">${t.nwPrompt}</label>
          <input type="text" id="wordInput" autocomplete="off" class="w-full text-center px-4 py-3 text-xl font-bold bg-white border-2 border-slate-300 rounded-2xl focus:border-amber-500" placeholder="${t.nwPlaceholder}">
        </div>
        ${submitBtn(t.checkBtn)}`;
    }

    // ---- 3. Isometric MAB blocks
    function renderMabBlocksQ(ws) {
      const t = T();
      const s = quizSource === 'original' ? pick(quizBank.mabBlocks) : { thousands: rnd(1, 9), hundreds: rnd(0, 9), tens: rnd(0, 9), ones: rnd(0, 9) };
      const q = { ...s, total: s.thousands * 1000 + s.hundreds * 100 + s.tens * 10 + s.ones };
      Q = { check: () => intVal('mabInput') === q.total, exp: () => T().mabExp(q), q };
      const group = (kind, n, tone) => n ? `
        <figure class="flex flex-col items-center m-0">
          <figcaption class="text-xs font-bold text-${tone}-800 mb-1">${t.mabLabels[kind](n)}</figcaption>
          <div class="flex flex-wrap items-end justify-center gap-1 ${kind === 'thousand' ? 'max-w-[260px]' : kind === 'one' ? 'max-w-[70px]' : 'max-w-[200px]'}">${MAB.piece(kind).repeat(n)}</div>
        </figure>` : '';
      ws.innerHTML = `
        <div class="mb-4 w-full">
          <div class="text-xs font-bold text-slate-600 mb-2">${t.mabPrompt}</div>
          <div id="mabDiagram" role="img" aria-label="${t.mabAria(q.thousands, q.hundreds, q.tens, q.ones)}" class="flex flex-wrap items-end justify-center gap-4 sm:gap-6 p-4 bg-slate-100 rounded-2xl border border-slate-200">
            ${group('thousand', q.thousands, 'amber')}${group('hundred', q.hundreds, 'blue')}${group('ten', q.tens, 'emerald')}${group('one', q.ones, 'rose')}
          </div>
          <div class="mt-4 text-sm font-bold text-slate-700">
            <span class="text-amber-700">${q.thousands}</span> ${t.mabEq[0]} + <span class="text-blue-700">${q.hundreds}</span> ${t.mabEq[1]} +
            <span class="text-emerald-700">${q.tens}</span> ${t.mabEq[2]} + <span class="text-rose-700">${q.ones}</span> ${t.mabEq[3]} = ?
          </div>
        </div>
        <div class="flex flex-wrap items-center justify-center gap-2">${numInput('mabInput')}${submitBtn(t.checkBtn)}</div>`;
    }

    // ---- 4. Expanded form
    function renderExpandedQ(ws) {
      const t = T();
      const n = quizSource === 'original' ? pick(quizBank.expanded).num : rnd(1000, 9999);
      const parts = expandedParts(n);
      Q = { check: () => parts.every((p, i) => intVal('exp_' + i) === p), exp: () => T().expExp(n, parts) };
      ws.innerHTML = `
        <div class="mb-4">
          <span class="text-xs font-bold text-slate-600 uppercase">${t.expTitle}</span>
          <div class="text-5xl font-black text-slate-900 mt-2 font-mono">${n}</div>
          <p class="text-xs text-slate-600 mt-2">${t.expPrompt}</p>
        </div>
        <div class="flex flex-wrap items-center justify-center gap-2 text-xl font-bold font-mono">
          ${parts.map((_, i) => `<input type="number" inputmode="numeric" id="exp_${i}" aria-label="${i + 1}" class="w-24 text-center px-2 py-2 bg-white border-2 border-slate-300 rounded-xl focus:border-amber-500" placeholder="?">${i < parts.length - 1 ? '<span class="text-slate-500" aria-hidden="true">+</span>' : ''}`).join('')}
        </div>
        <div class="mt-5">${submitBtn(t.checkBtn)}</div>`;
    }

    // ---- 5. Comparison
    function renderComparisonQ(ws) {
      const t = T();
      let a, b;
      if (quizSource === 'original') ({ left: a, right: b } = pick(quizBank.comparison));
      else { a = rnd(1000, 9979); b = Math.min(9999, Math.max(1000, a + rnd(1, 20) * (Math.random() < 0.5 ? -1 : 1))); if (a === b) b = a + 1; }
      const ans = a > b ? '>' : '<';
      Q = { exp: () => T().cmpExp(a, b, ans) };
      ws.innerHTML = `
        <div class="mb-6 flex flex-wrap items-center justify-center gap-4 sm:gap-6 text-4xl sm:text-6xl font-black font-mono">
          <span class="text-blue-700">${a}</span>
          <div class="w-16 h-16 border-2 border-dashed border-amber-400 rounded-2xl flex items-center justify-center text-amber-700 text-3xl" id="compBox">?</div>
          <span class="text-emerald-700">${b}</span>
        </div>
        <div class="flex items-center gap-4">
          ${['<', '>'].map(s => `<button type="button" class="cmp-btn min-h-[48px] px-8 py-3 bg-amber-100 hover:bg-amber-200 border-2 border-amber-400 rounded-2xl text-3xl font-black text-amber-900 active:scale-95 transition shadow-sm" data-s="${s}">${s === '<' ? '&lt;' : '&gt;'}</button>`).join('')}
        </div>`;
      ws.querySelectorAll('.cmp-btn').forEach(btn => btn.addEventListener('click', () => { $('compBox').textContent = btn.dataset.s; showFeedback(btn.dataset.s === ans, Q.exp()); }));
    }

    // ---- 6. Rounding to the nearest thousand
    function renderRoundingQ(ws) {
      const t = T();
      const s = quizSource === 'original' ? pick(quizBank.rounding) : { num: rnd(1000, 9999) };
      const correct = roundTo(s.num, 1000);
      Q = { check: () => intVal('roundInput') === correct, exp: () => T().rndExp(s.num, correct) };
      ws.innerHTML = `
        <div class="mb-4">
          <span class="text-xs font-bold text-slate-600 uppercase">${t.rndPrompt}</span>
          <div class="text-6xl font-black text-slate-900 my-2 font-mono">${s.num}</div>
          ${s.notice ? `<div class="text-xs bg-rose-50 text-rose-800 border border-rose-200 px-3 py-1 rounded-full font-bold inline-block mb-2">${t.rndNotice}</div>` : ''}
        </div>
        <div class="flex flex-wrap items-center justify-center gap-3">${numInput('roundInput')}${submitBtn(t.checkBtn)}</div>`;
    }

    // ---- 7. Bonus triple rounding
    function renderBonusQ(ws) {
      const t = T();
      const n = quizSource === 'original' ? pick(quizBank.bonus).num : rnd(1000, 9999);
      const [a, b, c] = [roundTo(n, 1000), roundTo(n, 100), roundTo(n, 10)];
      Q = { check: () => intVal('bonus_th') === a && intVal('bonus_h') === b && intVal('bonus_t') === c, exp: () => T().bonusExp(n, a, b, c) };
      const row = (id, label, tone) => `<div class="flex items-center justify-between gap-2 p-3 bg-slate-50 border rounded-xl"><label for="${id}" class="text-${tone}-800">${label}</label>${numInput(id, 'w-28')}</div>`;
      ws.innerHTML = `
        <div class="mb-4">
          <span class="text-xs font-bold text-rose-700 bg-rose-50 px-3 py-1 rounded-full border border-rose-200 uppercase">${t.bonusBadge}</span>
          <div class="text-6xl font-black my-2 font-mono tracking-widest text-emerald-700">${n}</div>
          <p class="text-xs text-slate-600">${t.bonusPrompt}</p>
        </div>
        <div class="w-full max-w-sm space-y-3 text-left font-bold text-sm">${row('bonus_th', t.bonusTh, 'amber')}${row('bonus_h', t.bonusH, 'blue')}${row('bonus_t', t.bonusT, 'emerald')}</div>
        <div class="mt-4">${submitBtn(t.checkBtn)}</div>`;
    }

    function submitAnswer() { if (Q && Q.check && !answered) showFeedback(Q.check(), Q.exp()); }

    function showFeedback(isCorrect, explanation) {
      answered = true;
      attemptCount++;
      const banner = $('feedbackBanner');
      banner.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-900', 'border-emerald-300', 'bg-rose-50', 'text-rose-900', 'border-rose-300');
      if (isCorrect) {
        score += 10; streak += 1; correctCount++;
        playTone('correct');
        try { confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 }, disableForReducedMotion: true }); } catch (e) { }
        banner.classList.add('bg-emerald-50', 'text-emerald-900', 'border', 'border-emerald-300');
        $('feedbackIcon').textContent = '🎉';
        $('feedbackTitle').textContent = T().correct;
      } else {
        streak = 0;
        playTone('wrong');
        banner.classList.add('bg-rose-50', 'text-rose-900', 'border', 'border-rose-300');
        $('feedbackIcon').textContent = '💡';
        $('feedbackTitle').textContent = T().incorrect;
      }
      $('feedbackExplanation').textContent = explanation;
      $('scoreVal').textContent = score;
      $('streakVal').textContent = streak;
      $('correctCount').textContent = correctCount;
      $('attemptCount').textContent = attemptCount;
      if (window.TNQ) TNQ.progress(score, streak);
    }

    function nextQuestion() { activeQuestionIndex++; loadCurrentQuestion(); }

    styleTabs();
    applyStaticI18n();
    loadCurrentQuestion();
  </script>
</body>

</html>
